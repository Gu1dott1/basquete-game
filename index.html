<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SANGUE NO OCTÓGONO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#070709; --panel:#111116; --panel2:#181820;
    --red:#e2091c; --red2:#ff2436; --redglow:rgba(226,9,28,.55);
    --blue:#1274ff; --blue2:#3a92ff;
    --gold:#ffbe12; --gold2:#ffe27a;
    --txt:#f4f4f6; --dim:#8b8b98; --line:#2a2a34;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:'Oswald',system-ui,sans-serif;color:var(--txt);background:var(--bg);
    min-height:100vh;overflow-x:hidden;display:flex;justify-content:center}
  .bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .bgfx .glow{position:absolute;top:-20%;left:50%;transform:translateX(-50%);width:150%;height:70%;
    background:radial-gradient(60% 60% at 50% 0%,rgba(226,9,28,.28),transparent 70%)}
  .bgfx .glow2{position:absolute;bottom:-30%;left:-20%;width:80%;height:70%;
    background:radial-gradient(closest-side,rgba(18,116,255,.12),transparent)}
  .bgfx .oct{position:absolute;top:8%;left:50%;transform:translate(-50%,0);width:min(560px,120vw);opacity:.06}
  .bgfx .grid{position:absolute;inset:0;background-image:
    linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
    background-size:44px 44px;-webkit-mask-image:radial-gradient(70% 60% at 50% 30%,#000,transparent);
    mask-image:radial-gradient(70% 60% at 50% 30%,#000,transparent)}
  .app{position:relative;z-index:1;width:100%;max-width:460px;padding:18px 16px 40px}

  .brand{text-align:center;padding:10px 0 22px}
  .brand .kick{font-family:'Barlow Condensed';font-weight:800;font-size:11px;letter-spacing:5px;color:var(--red2)}
  .brand h1{font-family:'Anton';font-size:44px;line-height:.86;letter-spacing:.5px;
    background:linear-gradient(180deg,#fff 30%,#c9c9d2);-webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 6px 30px rgba(226,9,28,.25);transform:skewX(-4deg)}
  .brand h1 .r{background:linear-gradient(180deg,var(--red2),var(--red));-webkit-background-clip:text;background-clip:text;color:transparent}
  .brand .sub{font-family:'Barlow Condensed';font-weight:700;font-size:12px;letter-spacing:4px;color:var(--dim);margin-top:8px}

  .sect-h{font-family:'Barlow Condensed';font-weight:800;font-size:13px;letter-spacing:3px;color:var(--gold);
    text-transform:uppercase;margin-bottom:14px;display:flex;align-items:center;gap:10px}
  .sect-h::before{content:"";width:20px;height:3px;background:var(--red);display:inline-block}

  .panel{background:linear-gradient(180deg,var(--panel),#0d0d12);border:1px solid var(--line);
    border-radius:4px;padding:20px;margin-bottom:14px;position:relative;
    clip-path:polygon(0 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%)}
  .panel::after{content:"";position:absolute;left:0;top:0;width:3px;height:100%;
    background:linear-gradient(180deg,var(--red),transparent)}

  label{display:block;font-family:'Barlow Condensed';font-weight:700;font-size:12px;color:var(--dim);
    margin:16px 0 7px;text-transform:uppercase;letter-spacing:2px}
  input,select{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:3px;
    color:var(--txt);padding:13px;font-size:16px;font-family:'Oswald';outline:none;transition:.15s}
  input::placeholder{color:#55555f}
  input:focus,select:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(226,9,28,.15)}

  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
  .chip{flex:1 1 auto;text-align:center;background:var(--panel2);border:1px solid var(--line);
    border-radius:3px;padding:11px 6px;font-family:'Barlow Condensed';font-weight:700;font-size:14px;
    letter-spacing:1px;cursor:pointer;transition:.15s;text-transform:uppercase;color:var(--dim)}
  .chip:hover{border-color:#444}
  .chip.active{background:linear-gradient(180deg,var(--red2),var(--red));border-color:var(--red2);color:#fff;
    box-shadow:0 4px 16px var(--redglow)}

  .btn{width:100%;border:none;cursor:pointer;margin-top:18px;padding:16px;position:relative;
    font-family:'Barlow Condensed';font-weight:800;font-size:17px;letter-spacing:2px;text-transform:uppercase;
    color:#fff;background:linear-gradient(100deg,var(--red),#a8071a);
    clip-path:polygon(0 0,100% 0,100% 100%,10px 100%,0 calc(100% - 10px));
    box-shadow:0 8px 26px var(--redglow);transition:.12s}
  .btn:active{transform:translateY(2px);box-shadow:0 4px 14px var(--redglow)}
  .btn.gold{background:linear-gradient(100deg,var(--gold),#d99500);color:#231800;box-shadow:0 8px 26px rgba(255,190,18,.4)}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--dim);box-shadow:none;clip-path:none;border-radius:3px}
  .btn.ghost:hover{border-color:var(--red);color:#fff}
  .btn.sm{font-size:14px;padding:12px}
  .hidden{display:none}
  @keyframes slideIn{0%{transform:translateX(30px);opacity:0}100%{transform:translateX(0);opacity:1}}
  .cont-card{display:flex;align-items:center;gap:14px;background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:10px 14px}
  .cont-fig .fig-svg{width:54px;height:72px;display:block;animation:none}
  .cont-info b{display:block;font-family:'Anton';font-size:22px;line-height:1;letter-spacing:.5px}
  .cont-info span{display:block;font-family:'Barlow Condensed';font-weight:800;font-style:italic;color:var(--red2);font-size:15px;margin:2px 0 4px}
  .cont-info small{display:block;font-family:'Barlow Condensed';font-weight:600;font-size:12px;letter-spacing:1px;color:var(--dim);text-transform:uppercase;line-height:1.4}
  .cont-note{text-align:center;font-family:'Barlow Condensed';font-weight:700;font-size:11px;letter-spacing:2px;color:var(--dim);text-transform:uppercase;margin-top:12px}
  .confirm-msg{padding:18px 16px 6px;font-family:'Oswald';font-weight:300;font-size:14px;color:#e8e8ee;line-height:1.5}
  .confirm-msg b{color:#fff;font-weight:600}
  .confirm-acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 16px 16px}
  .confirm-acts .btn{margin-top:0}

  .fcard{position:relative;border-radius:6px;overflow:hidden;padding:22px 20px 20px;
    background:radial-gradient(120% 80% at 50% -10%,rgba(226,9,28,.5),transparent 55%),
      linear-gradient(160deg,#26262f 0%,#141419 45%,#0c0c10 100%);
    border:1px solid #3a3a46;box-shadow:0 20px 50px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06);
    clip-path:polygon(0 0,100% 0,100% 100%,22px 100%,0 calc(100% - 22px))}
  .fcard::before{content:"";position:absolute;inset:0;
    background:repeating-linear-gradient(115deg,transparent,transparent 16px,rgba(255,255,255,.02) 16px,rgba(255,255,255,.02) 17px);pointer-events:none}
  .fcard::after{content:"";position:absolute;top:-40%;left:-30%;width:60%;height:180%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent);transform:rotate(18deg);animation:shine 5s ease-in-out infinite}
  @keyframes shine{0%,100%{left:-40%}50%{left:120%}}
  .fcard .ovr{position:absolute;top:18px;left:20px;line-height:.8}
  .fcard .ovr .n{font-family:'Anton';font-size:52px;color:var(--gold);text-shadow:0 3px 18px rgba(255,190,18,.45)}
  .fcard .ovr .l{font-family:'Barlow Condensed';font-weight:800;font-size:12px;letter-spacing:3px;color:#fff;margin-top:2px}
  .fcard .ovr .pos{font-family:'Barlow Condensed';font-weight:700;font-size:12px;color:var(--red2);letter-spacing:1px}
  .fcard .flag{position:absolute;top:20px;right:20px;background:var(--panel2);border:1px solid var(--line);
    font-family:'Barlow Condensed';font-weight:800;font-size:14px;letter-spacing:1px;padding:4px 10px;border-radius:2px;color:var(--gold2)}
  .fcard .silhouette{text-align:center;font-size:74px;margin:26px 0 6px;filter:drop-shadow(0 8px 20px rgba(0,0,0,.6));position:relative;z-index:1}
  .fcard .fname{font-family:'Anton';font-size:30px;text-align:center;line-height:.9;letter-spacing:.5px;position:relative;z-index:1;transform:skewX(-3deg)}
  .fcard .fnick{font-family:'Barlow Condensed';font-weight:800;font-style:italic;text-align:center;color:var(--red2);
    font-size:16px;letter-spacing:1px;margin:2px 0 4px;position:relative;z-index:1}
  .fcard .meta{text-align:center;font-family:'Barlow Condensed';font-weight:600;font-size:12px;letter-spacing:2px;
    color:var(--dim);text-transform:uppercase;margin-bottom:16px;position:relative;z-index:1}
  .fcard .belt{display:block;text-align:center;font-family:'Barlow Condensed';font-weight:800;letter-spacing:2px;
    color:#231800;background:linear-gradient(180deg,var(--gold2),var(--gold));padding:5px;border-radius:2px;margin-bottom:14px;font-size:13px}
  .attrs{display:grid;grid-template-columns:1fr 1fr;gap:11px 18px;position:relative;z-index:1}
  .attr .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
  .attr .top span{font-family:'Barlow Condensed';font-weight:600;font-size:12px;letter-spacing:1px;color:var(--dim);text-transform:uppercase}
  .attr .top b{font-family:'Anton';font-size:17px;color:#fff}
  .bar{height:5px;background:#000;border-radius:3px;overflow:hidden}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--red2),var(--gold));border-radius:3px;transition:width .6s cubic-bezier(.2,1,.3,1)}

  .stagebar{display:flex;gap:6px;margin:16px 0 4px}
  .stagebar .st{flex:1;text-align:center;font-family:'Barlow Condensed';font-weight:700;font-size:10px;letter-spacing:1px;
    color:#55555f;text-transform:uppercase;padding-bottom:8px;border-bottom:3px solid var(--line);transition:.3s}
  .stagebar .st.on{color:var(--gold);border-color:var(--gold)}
  .stagebar .st.done{color:var(--red2);border-color:var(--red)}
  .record{display:flex;gap:8px;margin:14px 0}
  .rec{flex:1;text-align:center;background:linear-gradient(180deg,var(--panel2),#0e0e13);border:1px solid var(--line);border-radius:3px;padding:11px 4px}
  .rec b{display:block;font-family:'Anton';font-size:26px;line-height:1}
  .rec.w b{color:#37d47e}.rec.l b{color:var(--red2)}.rec.d b{color:var(--dim)}
  .rec span{font-family:'Barlow Condensed';font-weight:700;font-size:10px;letter-spacing:2px;color:var(--dim)}

  .titlefight{text-align:center;font-family:'Barlow Condensed';font-weight:800;letter-spacing:3px;color:var(--gold);
    font-size:14px;margin-bottom:10px;text-transform:uppercase}
  .tape{display:flex;align-items:stretch;background:linear-gradient(180deg,#0e0e13,#080809);
    border:1px solid var(--line);border-radius:4px;overflow:hidden;position:relative}
  .corner{flex:1;padding:16px 10px;text-align:center;position:relative}
  .corner.redc{background:linear-gradient(180deg,rgba(226,9,28,.16),transparent)}
  .corner.bluec{background:linear-gradient(180deg,rgba(18,116,255,.16),transparent)}
  .corner .tag{font-family:'Barlow Condensed';font-weight:800;font-size:10px;letter-spacing:2px}
  .redc .tag{color:var(--red2)} .bluec .tag{color:var(--blue2)}
  .corner .emo{font-size:40px;margin:6px 0;filter:drop-shadow(0 4px 8px rgba(0,0,0,.5))}
  .corner .nm{font-family:'Barlow Condensed';font-weight:800;font-size:15px;line-height:1;letter-spacing:.5px}
  .corner .ov{font-family:'Anton';font-size:34px;margin-top:6px}
  .redc .ov{color:var(--red2)} .bluec .ov{color:var(--blue2)}
  .corner .ovl{font-family:'Barlow Condensed';font-weight:700;font-size:9px;letter-spacing:2px;color:var(--dim)}
  .tape .mid{display:flex;align-items:center;justify-content:center;padding:0 4px;font-family:'Anton';font-size:22px;color:#fff;position:relative}
  .tape .mid span{background:var(--bg);border:2px solid var(--red);border-radius:50%;width:44px;height:44px;
    display:flex;align-items:center;justify-content:center;box-shadow:0 0 20px var(--redglow);transform:skewX(-4deg)}
  .tape-stats{display:flex;flex-direction:column;gap:1px;background:var(--line);margin-top:1px}
  .trow{display:flex;background:var(--panel);font-family:'Barlow Condensed';font-weight:700;font-size:13px}
  .trow>div{flex:1;padding:7px 12px;text-align:center}
  .trow .lbl{flex:0 0 40%;color:var(--dim);font-size:10px;letter-spacing:2px;text-transform:uppercase;display:flex;align-items:center;justify-content:center}
  .trow .rv{color:var(--red2);text-align:right}.trow .bv{color:var(--blue2);text-align:left}

  .result{text-align:center;padding:10px 4px 4px;position:relative}
  .result .banner{font-family:'Barlow Condensed';font-weight:800;letter-spacing:5px;font-size:13px;color:var(--dim)}
  .result .method{font-family:'Anton';font-size:60px;line-height:.85;margin:6px 0;letter-spacing:1px;transform:skewX(-5deg)}
  .method.ko{color:var(--red2);text-shadow:0 0 40px var(--redglow),0 4px 0 #6b0410}
  .method.sub{color:var(--gold);text-shadow:0 0 40px rgba(255,190,18,.6)}
  .method.dec{color:#fff}
  .method.loss{color:#6a6a75}
  .result .rd{font-family:'Barlow Condensed';font-weight:800;letter-spacing:4px;font-size:14px;color:var(--gold2)}
  .result .story{font-family:'Oswald';font-size:14px;color:#cfcfd6;line-height:1.55;margin:16px 6px;font-weight:300}
  .champbanner{font-family:'Anton';font-size:22px;color:#231800;letter-spacing:1px;line-height:1;
    background:linear-gradient(180deg,var(--gold2),var(--gold));padding:12px;border-radius:3px;margin:10px 0;box-shadow:0 8px 30px rgba(255,190,18,.4)}
  .cartel{font-family:'Barlow Condensed';font-weight:700;letter-spacing:1px;color:var(--dim);font-size:14px;margin-top:6px}
  .cartel b{color:#fff;font-size:18px}

  @keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-7px,3px)}40%{transform:translate(6px,-4px)}60%{transform:translate(-5px,-2px)}80%{transform:translate(4px,3px)}}
  .shake{animation:shake .45s ease}
  @keyframes flashwhite{0%{opacity:.85}100%{opacity:0}}
  .whiteflash{position:fixed;inset:0;background:#fff;z-index:99;pointer-events:none;animation:flashwhite .35s ease forwards}
  @keyframes pop{0%{transform:scale(.6) skewX(-5deg);opacity:0}60%{transform:scale(1.08) skewX(-5deg)}100%{transform:scale(1) skewX(-5deg);opacity:1}}
  .pop{animation:pop .4s cubic-bezier(.2,1.3,.4,1)}

  .foot{text-align:center;color:#44444d;font-family:'Barlow Condensed';font-size:10px;letter-spacing:2px;margin-top:16px}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);z-index:100;
    background:var(--panel2);border:1px solid var(--gold);color:var(--gold2);padding:13px 20px;border-radius:4px;
    font-family:'Barlow Condensed';font-weight:700;letter-spacing:1px;font-size:14px;opacity:0;transition:.3s;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .fstage{animation:slideIn .3s ease}
  .round-ind{text-align:center;font-family:'Anton';font-size:22px;color:var(--gold);letter-spacing:1px;margin-bottom:10px}
  .round-ind small{font-family:'Barlow Condensed';font-size:12px;color:var(--dim);letter-spacing:1px}
  .fbars{display:flex;flex-direction:column;gap:10px;margin-bottom:8px}
  .fbtop{display:flex;justify-content:space-between;align-items:baseline;font-family:'Barlow Condensed';font-weight:700;font-size:12px;letter-spacing:1px;margin-bottom:3px}
  .fbtop span{font-family:'Anton';color:#fff;font-size:15px}
  .hpbar{height:13px;background:#000;border:1px solid var(--line);border-radius:3px;overflow:hidden}
  .hpbar i{display:block;height:100%;transition:width .45s cubic-bezier(.2,1,.3,1)}
  .hpbar i.red{background:linear-gradient(90deg,#7a0410,var(--red2))}
  .hpbar i.blue{background:linear-gradient(90deg,#0a3c80,var(--blue2))}
  .stbar{height:4px;background:#000;border-radius:2px;overflow:hidden;margin-top:3px}
  .stbar i{display:block;height:100%;background:linear-gradient(90deg,#b98a00,var(--gold));transition:width .4s}
  .ring{position:relative;height:150px;margin:6px 0 12px;border:1px solid var(--line);border-radius:6px;
    background:radial-gradient(70% 90% at 50% 100%,rgba(226,9,28,.18),transparent 70%),repeating-linear-gradient(0deg,#0c0c11,#0c0c11 8px,#0e0e14 8px,#0e0e14 16px);
    display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 14px;overflow:hidden}
  .ring::after{content:"";position:absolute;left:50%;top:50%;width:130px;height:130px;transform:translate(-50%,-30%);
    border:1px solid rgba(226,9,28,.25);clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%)}
  .fighter{font-size:56px;transition:transform .18s ease;position:relative;z-index:1;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}
  .fighter.opp{transform:scaleX(-1)}
  .fighter.you.lunge-you{transform:translateX(38px) scale(1.05)}
  .fighter.opp.lunge-opp{transform:scaleX(-1) translateX(38px) scale(1.05)}
  .fighter.you.hit{animation:hitY .32s ease}
  @keyframes hitY{0%,100%{}25%{filter:brightness(2.2) drop-shadow(0 0 12px var(--red2))}50%{transform:translateX(-8px) rotate(-5deg)}}
  .fighter.opp.hit{animation:hitO .32s ease}
  @keyframes hitO{0%,100%{transform:scaleX(-1)}25%{filter:brightness(2.2) drop-shadow(0 0 12px var(--blue2))}50%{transform:scaleX(-1) translateX(-8px) rotate(-5deg)}}
  .fighter.ko{animation:kofall .6s forwards}
  @keyframes kofall{100%{transform:rotate(88deg) translateY(24px);opacity:.45}}
  .dmgnum{position:absolute;top:38px;font-family:'Anton';font-size:24px;animation:floatup .8s forwards;z-index:3;pointer-events:none}
  .dmgnum.l{left:24px;color:var(--red2)}
  .dmgnum.r{right:24px;color:var(--blue2)}
  @keyframes floatup{0%{opacity:0;transform:translateY(10px) scale(.6)}30%{opacity:1;transform:translateY(-6px) scale(1.25)}100%{opacity:0;transform:translateY(-42px)}}
  .coach{background:var(--panel2);border-left:3px solid var(--gold);border-radius:3px;padding:10px 12px;
    font-family:'Oswald';font-size:13px;font-weight:300;color:#e8e8ee;margin-bottom:10px;min-height:42px;animation:slideIn .3s ease}
  .coach b{color:var(--gold2);font-weight:600}
  .coach .cico{font-size:16px}
  .pbp{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;min-height:18px}
  .pbp .pline{font-family:'Oswald';font-weight:300;font-size:12px;color:var(--dim);padding:5px 9px;background:rgba(255,255,255,.02);border-radius:3px;animation:slideIn .22s ease}
  .pbp .pline:first-child{color:#fff;background:rgba(226,9,28,.09)}
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .actbtn{border:1px solid var(--line);background:linear-gradient(180deg,var(--panel2),#0f0f14);color:#fff;
    border-radius:4px;padding:11px 12px;text-align:left;cursor:pointer;transition:.12s;font-family:'Oswald'}
  .actbtn:hover{border-color:var(--red);transform:translateY(-1px)}
  .actbtn:active{transform:translateY(1px)}
  .actbtn b{display:block;font-family:'Barlow Condensed';font-weight:800;font-size:15px;letter-spacing:.5px;text-transform:uppercase}
  .actbtn span{font-size:10px;color:var(--dim)}
  .scorecard{animation:slideIn .3s ease;text-align:center;padding:8px 0}
  .sc-h{font-family:'Barlow Condensed';font-weight:800;letter-spacing:3px;color:var(--gold);font-size:15px;margin-bottom:16px}
  .sc-legend{font-family:'Barlow Condensed';font-weight:800;font-size:12px;letter-spacing:1px;color:var(--dim);margin:-8px 0 12px}
  .sc-legend .r{color:var(--red2)} .sc-legend .b{color:var(--blue2)}
  .sc-grid{display:grid;grid-template-columns:auto repeat(3,1fr);gap:5px;max-width:360px;margin:0 auto 14px}
  .sc-c{background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:8px 4px;text-align:center;animation:slideIn .25s ease;font-family:'Anton';font-size:18px;color:#7a7a85}
  .sc-c b{font-weight:400}
  .sc-c b.win{color:var(--red2)} .sc-c b.bwin{color:var(--blue2)}
  .sc-hd{background:transparent;border:none;padding:2px 4px;animation:none;font-family:'Barlow Condensed';font-weight:700;font-size:11px;letter-spacing:1px;color:var(--dim);text-transform:uppercase}
  .sc-rd{font-family:'Barlow Condensed';font-weight:700;font-size:11px;letter-spacing:1px;color:var(--dim);text-align:left;padding:8px 10px;display:flex;align-items:center}
  .sc-tot{border-color:var(--gold);background:linear-gradient(180deg,rgba(255,190,18,.10),var(--panel2))}

function buildChips(id,arr,field){
  var el=document.getElementById(id);
  arr.forEach(function(v,i){
    var c=document.createElement("div");c.className="chip"+(i===2?" active":"");c.textContent=v;
    c.onclick=function(){
      var kids=el.children;for(var k=0;k<kids.length;k++)kids[k].classList.remove("active");
      c.classList.add("active");F[field]=v;if(field==="style")F.emo=EMOJIS[STYLES.indexOf(v)];
    };
    el.appendChild(c);
  });
  F[field]=arr[2];
}

var DIVSTATE={},RANK=[],CHAMP=null,curDivName="Pena";
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function divIndex(n){for(var i=0;i<DIVS.length;i++)if(DIVS[i].name===n)return i;return 2;}
/* Escala do ranking: campeão ~84-87, #1 ~79 até #15 ~65. O OVR mostrado é o OVR real da luta. */
function npcOvrForRank(k){return Math.round(79-k+rnd(-1,1));}
function genDivision(name){
  var R=DIVROSTER[name];
  var cs=styleFor(R.champ),ca=genAttrs(84+rnd(0,3),cs,3);
  var champ={name:R.champ,emo:"🏆",ovr:ovrOf(ca),rec:[rnd(20,27),rnd(0,2),0],real:true,sty:cs,a:ca};
  var rank=[];
  for(var k=0;k<15;k++){var sk=styleFor(R.list[k]),a=genAttrs(npcOvrForRank(k),sk,3);rank.push({name:R.list[k],emo:"🥊",ovr:ovrOf(a),rec:[rnd(8,19),rnd(1,7),rnd(0,2)],sty:sk,a:a});}
  DIVSTATE[name]={champ:champ,rank:rank};
}
function setDivision(name){
  curDivName=name;
  if(!DIVSTATE[name])genDivision(name);
  RANK=DIVSTATE[name].rank;CHAMP=DIVSTATE[name].champ;
  F.champion=!!(F.belts&&F.belts[name]);
}
function notYou(e){return !e.you;}
function playerIdx(){for(var i=0;i<RANK.length;i++){if(RANK[i].you)return i;}return -1;}
function playerRank(){var i=playerIdx();return i<0?16:i+1;}
function rec(e){return e.rec[0]+'-'+e.rec[1]+'-'+e.rec[2];}
function posStr(){return F.champion?'CAMPEÃO':(playerRank()>=16?'sem ranking':'#'+playerRank());}
function titleWasShot(){return currentOpp.title && !F.champion && currentOpp.ref===CHAMP;}
function becomeChampion(){RANK=RANK.filter(notYou);RANK.unshift(CHAMP);DIVSTATE[curDivName].rank=RANK.slice(0,15);RANK=DIVSTATE[curDivName].rank;F.champion=true;F.belts=F.belts||{};F.belts[curDivName]=true;F.divsEver=F.divsEver||{};F.divsEver[curDivName]=true;F.beltIdle=F.beltIdle||{};F.beltIdle[curDivName]=0;F.maxBelts=Math.max(F.maxBelts||0,beltCount());}
function loseTitleTo(ref){RANK=RANK.filter(function(e){return e!==ref;});RANK.unshift({you:true});DIVSTATE[curDivName].rank=RANK.slice(0,15);RANK=DIVSTATE[curDivName].rank;F.champion=false;F.belts[curDivName]=false;CHAMP=ref;DIVSTATE[curDivName].champ=ref;}
function beltCount(){var n=0;if(F.belts)for(var k in F.belts)if(F.belts[k])n++;return n;}
function heldBelts(){var out=[];for(var i=0;i<DIVS.length;i++)if(F.belts&&F.belts[DIVS[i].name])out.push(DIVS[i].name);return out;}
function rankIndexByName(n){if(!n)return -1;for(var i=0;i<RANK.length;i++)if(!RANK[i].you&&RANK[i].name===n)return i;return -1;}
/* Cinturão fora da divisão atual: some depois de BELT_IDLE_MAX lutas sem defender (vira disputa entre #1 e #2). */
var BELT_IDLE_MAX=3;
function vacateBelt(name){
  F.belts[name]=false;if(F.beltIdle)F.beltIdle[name]=0;
  var st=DIVSTATE[name];if(!st)return;
  var arr=st.rank.filter(notYou);
  if(arr.length>=2){var w=npcBout(arr[0],arr[1]),l=(w===arr[0]?arr[1]:arr[0]);w.rec[0]++;l.rec[1]++;arr.splice(arr.indexOf(w),1);st.champ=w;}
  else if(arr.length)st.champ=arr.shift();
  st.rank=arr.slice(0,15);
  if(name===curDivName){RANK=st.rank;CHAMP=st.champ;F.champion=false;}
}
function tickBelts(){
  F.beltIdle=F.beltIdle||{};var lost=[];
  heldBelts().forEach(function(d){
    if(d===curDivName){F.beltIdle[d]=0;return;}
    F.beltIdle[d]=(F.beltIdle[d]||0)+1;
    if(F.beltIdle[d]>=BELT_IDLE_MAX){vacateBelt(d);lost.push(d);}
  });
  return lost;
}
function recordFight(op,ovr,emo,res,method,round,title,how){
  F.hist=F.hist||[];F.hist.push({op:op,div:curDivName,ovr:ovr,res:res,method:method,round:round,title:!!title,how:how});
  F.h2h=F.h2h||{};var hh=F.h2h[op]||{w:0,l:0,d:0,n:0,emo:emo};
  hh.n++;if(res==='V')hh.w++;else if(res==='D')hh.l++;else hh.d++;if(hh.n>=2||hh.l>0)hh.rival=true;F.h2h[op]=hh;
}
function legacyScore(){
  var belts=beltCount(),mb=Math.max(F.maxBelts||0,belts),divs=F.divsEver?Object.keys(F.divsEver).length:0,sc=0;
  sc+=F.w*3;sc+=(F.finishes||0)*2;sc+=(F.titleWins||0)*25;sc+=(F.titleDef||0)*15;
  sc+=belts*40;if(mb>=2)sc+=100;if(mb>=3)sc+=200;
  sc+=divs*30;sc+=(F.bestStreak||0)*4;if(F.l===0&&F.w>=5)sc+=80;
  return Math.round(sc);
}
function goatTier(L){return L<120?'PROSPECTO':L<280?'CONTENDER':L<460?'ESTRELA':L<680?'CAMPEÃO':L<900?'LENDA':'GOAT DO UFC';}
function p4pRank(L){return L<120?0:Math.max(1,Math.min(15,15-Math.floor((L-120)/55)));}
function showOverlay(inner){var el=document.getElementById("ladder");if(!el)return;el.innerHTML='<div class="ladder-box">'+inner+'</div>';el.classList.remove("hidden");}
function closeLadder(){var el=document.getElementById("ladder");if(el)el.classList.add("hidden");}
function openLadder(){
  ensureNPC(CHAMP);
  var cN=F.champion?F.nick.toUpperCase()+' (VOCÊ)':'<i class="lsty" title="'+STY[CHAMP.sty].nome+'">'+STY[CHAMP.sty].ico+'</i>'+CHAMP.name.toUpperCase();
  var cO=F.champion?F.ovr:CHAMP.ovr,cR=F.champion?(F.w+'-'+F.l+'-'+F.d):rec(CHAMP);
  var h='<div class="ladder-h">RANKING — '+curDivName.toUpperCase()+' ('+DIVS[divIndex(curDivName)].lbs+' lb)<button class="lx" onclick="closeLadder()">✕</button></div>';
  h+='<div class="lrow champ"><span class="lr">🏆</span><span class="ln">'+cN+'</span><span class="lrec">'+cR+'</span><span class="lov">'+cO+'</span></div>';
  for(var i=0;i<RANK.length;i++){var e=ensureNPC(RANK[i]),y=!!e.you;
    h+='<div class="lrow'+(y?' me':'')+'"><span class="lr">'+(i+1)+'</span><span class="ln">'+(y?F.nick.toUpperCase()+' (VOCÊ)':'<i class="lsty" title="'+STY[e.sty].nome+'">'+STY[e.sty].ico+'</i>'+e.name.toUpperCase())+'</span><span class="lrec">'+(y?(F.w+'-'+F.l+'-'+F.d):rec(e))+'</span><span class="lov">'+(y?F.ovr:e.ovr)+'</span></div>';}
  if(!F.champion&&playerRank()>=16)h+='<div class="lrow me"><span class="lr">–</span><span class="ln">'+F.nick.toUpperCase()+' (VOCÊ)</span><span class="lrec">'+(F.w+'-'+F.l+'-'+F.d)+'</span><span class="lov">'+F.ovr+'</span></div>';
  showOverlay(h);
}
function openDivisions(){
  var h='<div class="ladder-h">DIVISÕES <button class="lx" onclick="closeLadder()">✕</button></div>';
  for(var i=0;i<DIVS.length;i++){var d=DIVS[i],cur=(d.name===curDivName),belt=!!(F.belts&&F.belts[d.name]);
    var left=BELT_IDLE_MAX-((F.beltIdle&&F.beltIdle[d.name])||0);
    var adj=Math.abs(i-divIndex(curDivName))===1;
    var st=belt?(cur?'🏆 CAMPEÃO':'🏆 defenda em '+left+' luta'+(left>1?'s':'')):(cur?(playerRank()>=16?'sem ranking':'#'+playerRank()):((F.champion&&adj)?'⚡ SUPERLUTA':'desafiar'));
    h+='<div class="lrow'+(cur?' me':'')+(belt?' champ':'')+'"><span class="lr">'+d.lbs+'</span><span class="ln">'+d.name.toUpperCase()+'</span><span class="lrec">'+st+'</span>'+
       (cur?'<span class="lov">•</span>':'<button class="mvbtn" onclick="switchDivision(\''+d.name+'\')">IR ▸</button>')+'</div>';}
  h+='<div style="padding:12px 16px;font-size:11px;color:var(--dim);font-family:Oswald">Trocar de divisão: você entra sem ranking na nova. Campeão que sobe ou desce <b>uma</b> categoria ganha superluta direto pelo cinturão e mantém o atual — mas perde um cinturão se ficar '+BELT_IDLE_MAX+' lutas sem defendê-lo. Cinturões em 2+ divisões ao mesmo tempo = CHAMP-CHAMP e salto no ranking GOAT.</div>';
  showOverlay(h);
}
function switchDivision(name){
  if(name===curDivName){closeLadder();return;}
  if(PHASE==='fight'){toast('Termine a luta primeiro');return;}
  var od=curDivName, oldRank=playerRank(), wasChamp=F.champion;
  var adjacent=Math.abs(divIndex(name)-divIndex(od))===1;
  if(DIVSTATE[od])DIVSTATE[od].rank=DIVSTATE[od].rank.filter(notYou);
  F.weight=name;F.lastLossTo=null;F.unrankedWins=0;F.superFight=false;
  setDivision(name);
  if(F.champion){
    F.debutStrength=null;
    toast('De volta aos '+name.toUpperCase()+' — hora de defender o cinturão! 🏆');
  } else if(wasChamp && adjacent){
    F.superFight=true;F.debutStrength='strong';
    toast('SUPERLUTA pelo cinturão dos '+name.toUpperCase()+'! O dos '+od.toUpperCase()+' segue com você 🏆');
  } else {
    F.debutStrength=(wasChamp||oldRank<=8)?'strong':'weak';
    toast('Divisão dos '+name.toUpperCase()+' — '+(F.debutStrength==='strong'?'estreia contra alguém do ranking!':'comece de baixo, prove seu valor.'));
  }
  closeLadder();renderStages();renderFicha();nextFight();
}
function openHistory(){
  var h='<div class="ladder-h">HISTÓRICO — CARTEL '+F.w+'-'+F.l+'-'+F.d+'<button class="lx" onclick="closeLadder()">✕</button></div>';

  if(!H.length)h+='<div class="lrow"><span class="ln" style="color:var(--dim)">Nenhuma luta ainda.</span></div>';

  showOverlay(h);
}
function gstat(l,v){return '<div class="gstat"><span>'+l+'</span><b>'+v+'</b></div>';}
function gbench(l,who,v){return '<div class="gbench"><div class="gl">'+l+'<small>'+who+'</small></div><div class="gv">'+v+'</div></div>';}
function openGoat(){
  var L=legacyScore(),tier=goatTier(L),p4p=p4pRank(L),belts=beltCount(),mb=Math.max(F.maxBelts||0,belts),divs=F.divsEver?Object.keys(F.divsEver).length:0;

  h+=gstat('Cartel',F.w+'-'+F.l+'-'+F.d)+gstat('Nocautes/finalizações',(F.finishes||0))+gstat('Cinturões atuais',belts?(heldBelts().join(' · ')+(belts>=2?' — CHAMP-CHAMP!':'')):'0')+gstat('Divisões conquistadas',divs)+gstat('Defesas de título',(F.titleDef||0))+gstat('Títulos ganhos',(F.titleWins||0))+gstat('Maior sequência',(F.bestStreak||0)+' vit.');

function nextFight(){
  updateHUD();
  setContract();
  var st2=F.stage2||'liga',pr=playerRank();
  var opp,titleFlag=false,oppLabel,rematch=false,prospect=false,circuit=false;
  if(st2==='varzea'||st2==='nacional'){
    circuit=true;
    var pool=st2==='varzea'?VARZEA_NAMES:NAC_NAMES;
    var pl=pool[Math.floor(Math.random()*pool.length)];
    opp=genOpp(pl[0],pl[1],clamp(F.ovr+(st2==='varzea'?rnd(-6,0):rnd(-3,3)),40,90),[rnd(2,9),rnd(0,5),0]);
    oppLabel=st2==='varzea'?'VÁRZEA':'NACIONAL';
  } else if(F.superFight){opp=CHAMP;titleFlag=true;oppLabel='CAMPEÃO';F.superFight=false;}
  else if(!F.champion && pr>=16){
    if(F.debutStrength==='strong' && RANK.length>0){
      var di=Math.min(RANK.length-1,12+rnd(0,2));opp=RANK[di];oppLabel='#'+(di+1);
    } else {
      prospect=true;
      var pc=CONTENDERS[Math.floor(Math.random()*CONTENDERS.length)];
      opp=genOpp(pc[0],pc[1],clamp(F.ovr+rnd(-4,3),48,74),[rnd(3,10),rnd(0,4),0]);
      oppLabel='PROSPECTO';
    }
  } else if(F.champion){var i=Math.floor(Math.random()*Math.min(5,RANK.length));opp=RANK[i];titleFlag=true;oppLabel='#'+(i+1);}
  else if(pr===1 || (pr<=3 && (F.streak||0)>=4 && Math.random()<0.4)){opp=CHAMP;titleFlag=true;oppLabel='CAMPEÃO';}
  else {
    var ti;
    if(pr<=8 && Math.random()<0.15){ti=Math.min(RANK.length-1,(pr-1)+rnd(1,2));}
    else {var st=stepUp(F.streak||0);ti=Math.max(0,(pr-1)-st);if(ti>=pr-1)ti=pr-2;if(ti<0)ti=0;}
    opp=RANK[ti];oppLabel='#'+(ti+1);
  }
  if(st2==='liga' && !titleFlag && !prospect && F.lastLossTo){var li=rankIndexByName(F.lastLossTo);if(li>=0 && Math.random()<0.35){opp=RANK[li];oppLabel='#'+(li+1);rematch=true;}F.lastLossTo=null;}
  ensureNPC(opp);
  var oa=JSON.parse(JSON.stringify(opp.a)),oov=opp.ovr,peak=false;
  /* desafiante ao seu cinturão chega no melhor camp da carreira */
  if(titleFlag&&F.champion){var bump=rnd(BAL.titleCamp[0],BAL.titleCamp[1]);ATTRS.forEach(function(x){oa[x.key]=Math.min(99,oa[x.key]+bump);});oov=ovrOf(oa);peak=true;}
  currentOpp={name:opp.name,emo:opp.emo,ovr:oov,sty:opp.sty,a:oa,peak:peak,title:titleFlag,ref:((prospect||circuit)?null:opp),label:oppLabel,prospect:prospect,circuit:circuit,rematch:rematch,rec:opp.rec.slice()};
  currentOpp.coach=prefightCoach();currentOpp.plan=currentOpp.coach;
  PHASE='prefight';saveGame();
  renderPrefight();
}

  ATTRS.forEach(function(x){var d=Y[x.key]-O[x.key];if(!best||d>best.d)best={l:x.label,d:d};if(!worst||d<worst.d)worst={l:x.label,d:d};});
  if(best.d>=4)n.push('✅ Sua maior vantagem: <b>'+best.l+'</b> (+'+best.d+').');
  if(worst.d<=-4)n.push('⚠️ Maior vantagem dele: <b>'+worst.l+'</b> (+'+(-worst.d)+').');
  if(O.chao-Y.chao>=10)n.push(S.sub>=1.2?'🐍 Finalizador perigoso: não fique por baixo.':'🤼 Domina no chão: cuidado com as quedas.');
  else if(Y.chao-O.chao>=10)n.push('🤼 Você é muito melhor no chão: a queda é uma arma.');

  if(O.queixo<=Y.poder-10)n.push('🎯 Queixo dele é alvo: dá pra nocautear.');

/* Gera atributos com a forma do estilo e média = ovr. */
function genAttrs(ovr,sk,spread){
  var P=(STY[sk]||STY.completo).prof,a={},sum=0;
  ATTRS.forEach(function(x){var v=ovr+(P[x.key]||0)+(spread?rnd(-spread,spread):0);a[x.key]=v;sum+=v;});
  var shift=ovr-sum/ATTRS.length;
  ATTRS.forEach(function(x){a[x.key]=Math.max(30,Math.min(99,Math.round(a[x.key]+shift)));});
  return a;
}

    var p=diff+R(-BAL.judgeNoise,BAL.judgeNoise),y=10,o=10;
    if(Math.abs(p)<0.5){if(yAhead)o=9;else y=9;}
    else if(p>0)o=(p>BAL.judge108||kdDiff>=2?8:9);else y=(-p>BAL.judge108||kdDiff<=-2?8:9);
    out.push({y:y,o:o});
  }
  return out;
}
function gfResolve(){
  if(GF.result)return;
  var tot=[[0,0],[0,0],[0,0]];
  GF.cards.forEach(function(rc){for(var j=0;j<3;j++){tot[j][0]+=rc[j].y;tot[j][1]+=rc[j].o;}});
  var yJ=0,oJ=0,dJ=0,minMargin=99;
  tot.forEach(function(t){var m=t[0]-t[1];if(m>0)yJ++;else if(m<0)oJ++;else dJ++;minMargin=Math.min(minMargin,Math.abs(m));});
  var kind,won,type;
  if(dJ>=2||(yJ===1&&oJ===1)){kind='draw';won=null;type=(dJ===3?'unanime':(dJ===2?'majoritaria':'dividida'));}
  else{kind='dec';won=yJ>oJ;type=(Math.max(yJ,oJ)===3?'unanime':(dJ===1?'majoritaria':'dividida'));}
  GF.result={kind:kind,won:won,round:GF.rounds,time:'5:00',cards:GF.cards,totals:tot,decType:type,close:(type!=='unanime'||minMargin<=1)};
}
function decLabel(res){return res.kind==='draw'?'EMPATE '+DRAW_TXT[res.decType]:'DECISÃO '+DEC_TXT[res.decType];}
function howStr(res){
  var r=res.round,t=res.time?' '+res.time:'';
  if(res.kind==='ko')return 'NOCAUTE · R'+r+t;
  if(res.kind==='tko')return 'TKO'+(res.towel?' (TOALHA)':(res.cut?' (CORTE)':(res.legs?' (CHUTES)':'')))+' · R'+r+(res.towel?'':t);
  if(res.kind==='sub')return 'FINALIZAÇÃO'+(res.tec?' ('+res.tec.toUpperCase()+')':'')+' · R'+r+t;
  if(res.kind==='dec'||res.kind==='draw')return decLabel(res);
  return 'SEM RESULTADO';
}

function cloneFight(g){var c=JSON.parse(JSON.stringify(g,function(k,v){return k==='ev'?[]:v;}));c.quiet=true;return c;}
function coachEval(n){
  var saved=GF,res={};
  PLAN_KEYS.forEach(function(p){
    var sc=0;
    for(var i=0;i<n;i++){
      GF=cloneFight(saved);var g=0;
      while(!GF.result&&GF.round<GF.rounds&&g++<10)gfRound(p);
      gfResolve();sc+=GF.result.won===true?1:(GF.result.won===null?0.5:0);
    }
    res[p]=sc/n;
  });
  GF=saved;return res;
}
function coachBest(n){var r=coachEval(n||16),b='equilibrado';for(var k in r)if(r[k]>r[b]+0.0001)b=k;return b;}

function endFight(r){
  var kind=r.kind,won=r.won,round=r.round,close=r.close;
  var o=currentOpp,method,cls,story,ko=false,detail='';
  if(kind==='nc'){F.nc=(F.nc||0)+1;method='SEM RESULTADO';cls='dec';story='Falta acidental interrompeu tudo. Declarada SEM RESULTADO (No Contest) — não conta como vitória nem derrota.';}
  else if(kind==='draw'){F.d++;method='EMPATE';cls='dec';detail=DRAW_TXT[r.decType];story='Depois da distância completa, os juízes não separaram os dois. Empate '+DRAW_TXT[r.decType].toLowerCase()+'.';}
  else if(won){
    F.w++;
    if(kind==='ko'){method='NOCAUTE';cls='ko';ko=true;detail='ROUND '+round+(r.time?' · '+r.time:'');story=F.nick+' desligou '+o.name+' no round '+round+'! A arena explodiu.';}
    else if(kind==='tko'){method='NOCAUTE TÉCNICO';cls='ko';ko=true;detail=(r.cut?'CORTE · ':(r.legs?'CHUTES NA PERNA · ':''))+'ROUND '+round+(r.time?' · '+r.time:'');story=r.cut?(F.nick+' abriu um corte feio em '+o.name+' e o médico parou a luta no round '+round+'.'):(F.nick+' castigou '+o.name+' até a luta ser parada no round '+round+'.');}
    else if(kind==='sub'){method='FINALIZAÇÃO';cls='sub';detail=(r.tec?r.tec.toUpperCase()+' · ':'')+'ROUND '+round+(r.time?' · '+r.time:'');story=F.nick+' fez '+o.name+' bater no round '+round+(r.tec?' com '+r.tec:'')+'. Finalização limpa.';}
    else{method='DECISÃO';cls='dec';detail=DEC_TXT[r.decType];story=F.nick+' levou a decisão '+DEC_TXT[r.decType].toLowerCase()+' numa guerra de '+round+' rounds.';}
  } else {
    F.l++;method='DERROTA';cls='loss';detail=howStr(r);
    var how=(kind==='ko')?'foi nocauteado no round '+round:(kind==='tko')?(r.towel?'teve a toalha jogada pelo córner no round '+round:(r.cut?'foi parado por corte no round '+round:'foi parado (TKO) no round '+round)):(kind==='sub')?'bateu'+(r.tec?' ('+r.tec+')':'')+' no round '+round:'perdeu por decisão '+DEC_TXT[r.decType].toLowerCase();

  }

    else if(wasChamp){F.titleDef=(F.titleDef||0)+1;rankMsg='Cinturão defendido! ('+F.titleDef+'ª defesa)';}
    else {climbToSmart(currentOpp.ref,(kind==='ko'||kind==='sub'||kind==='tko'));rankMsg='Subiu para '+posStr()+' no ranking!';}

  } else if(kind!=='draw'){

    F.streak=0;
  } else { F.streak=0; }
  var gainTp=fightTP(won,kind,currentOpp.title),grew=naturalGrowth();
  F.tp=(F.tp||0)+gainTp;
  var stats=GF?{y:GF.Y.s,o:GF.O.s,on:currentOpp.name}:null;

  var res=won?'V':(kind==='draw'?'E':(kind==='nc'?'NC':'D'));

  payFight(won,kind,currentOpp.title);
  simEcosystem();
  advanceTime(kind,won);

  PHASE='result';saveGame();

  }

}

function fmtMoney(n){return '$'+Math.round(n||0).toLocaleString('en-US');}
function cleanName(v,max){return (v||'').replace(/[<>&"`\\]/g,'').trim().slice(0,max);}
function startCareer(force){
  var sv=readSave();
  if(sv&&!force){askConfirm('Começar uma nova carreira apaga a carreira salva de <b>'+cleanName(sv.F.nick,14)+'</b> ('+sv.F.w+'-'+sv.F.l+'-'+sv.F.d+'). Não dá pra desfazer.','APAGAR E COMEÇAR','startCareer(true)');return;}
  clearSave();

function initFighterAttrs(){
  var b=STYLE_START[F.style]||STYLE_START["Trocador"];
  ATTRS.forEach(function(a,i){F.attrs[a.key]=b[i];});
  F.carisma=40;
  F.potential=rnd(84,99);
  F.durability=rnd(58,99);
  F.primePeak=rnd(28,33);
  F.primeStart=F.primePeak-rnd(3,5);
  F.learnRate=0.85+Math.random()*0.5;
  F.age=rnd(19,22);
  F.traits=rollTraits();
  recalcOvr();
}
/* Pontos de treino: toda luta ensina alguma coisa (vitória ensina mais). */
function fightTP(won,kind,title){
  var fin=(kind==='ko'||kind==='tko'||kind==='sub');
  var t=won===true?BAL.tpWin+(fin?BAL.tpFinish:0):(kind==='draw'?BAL.tpDraw:(kind==='nc'?Math.round(BAL.tpLoss/2):BAL.tpLoss));
  if(title)t+=BAL.tpTitle;
  return t+(F.campBonus||0)*BAL.campTp;
}
/* Custo de +1 num atributo: fica mais caro quanto mais alto (retorno decrescente). */
function tpCost(v){return v<70?1:(v<80?2:(v<88?3:4));}
/* Evolução natural: jovem melhora sozinho (mais no estilo dele); no auge, quase nada. */
var STY_GROW={wrestler:['chao','cardio','fightIQ'],jiujitsu:['chao','fightIQ','coracao'],muaythai:['poder','cardio','agressao'],boxe:['precisao','velocidade','defesa'],trocador:['poder','queixo','agressao']};
function lowestAttr(){var lo=null;ATTRS.forEach(function(a){var k=a.key;if(F.attrs[k]<(F.potential||99)&&(lo===null||F.attrs[k]<F.attrs[lo]))lo=k;});return lo;}
function naturalGrowth(){
  var age=F.age||22,n=0,done=0;
  if(age<(F.primeStart||26))n=Math.round(rnd(BAL.growYoung[0],BAL.growYoung[1])*(F.learnRate||1));
  else if(age<=(F.primePeak||30))n=BAL.growPrime;
  var focus=STY_GROW[PLAYER_STY[F.style]]||[];
  for(var i=0;i<n;i++){
    var k=(Math.random()<0.5&&focus.length)?pick(focus):lowestAttr();
    if(k&&F.attrs[k]<(F.potential||99)){F.attrs[k]++;done++;}
  }
  recalcOvr();
  return done;
}
function enterRankings(){RANK=RANK.filter(notYou);RANK.splice(14,0,{you:true});DIVSTATE[curDivName].rank=RANK.slice(0,15);RANK=DIVSTATE[curDivName].rank;}
function setContract(){
  if((F.stage2||'liga')!=='liga')return;
  var t=0;
  if(F.champion)t=5;
  else{var pr=playerRank();if(pr>=16)t=0;else if(pr>=11)t=1;else if(pr>=6)t=2;else if(pr>=2)t=3;else t=4;}
  if(F.tierIdx==null)F.tierIdx=-1;
  if(t>F.tierIdx){F.tierIdx=t;var c=CONTRACTS[t],mult=1+(F.carisma||40)/120;F.contract={name:c.name,show:Math.round(c.show*mult),win:Math.round(c.win*mult),ppv:c.ppv};if(t>0){var b=Math.round(c.show*1.5);F.money=(F.money||0)+b;toast('Novo contrato: '+c.name+' (+'+fmtMoney(b)+')');}}
}
function venumPay(n){return n<=3?4000:n<=5?4500:n<=10?6000:n<=15?11000:(F.champion?42000:15000);}
function payFight(won,kind,title){
  var c=F.contract||{show:600,win:600,ppv:false},liga=(F.stage2==='liga');
  var show=c.show,winb=won?Math.round(c.win*(F.winMult||1)):0,venum=liga?venumPay((F.w||0)+(F.l||0)+(F.d||0)):0,bonus=0,ppv=0,notes=[];
  if(liga&&won&&(kind==='ko'||kind==='sub'||kind==='tko')&&Math.random()<(0.3+(F.carisma||40)/300)){bonus+=50000;notes.push('Performance da Noite');}
  if(liga&&(title||F.champion)&&(c.ppv||F.ppvDeal)){ppv=Math.round((F.carisma||40)*1500*(F.champion?1.4:1));notes.push('Pontos de PPV');}
  var total=show+winb+venum+bonus+ppv;
  F.money=(F.money||0)+total;F.careerEarn=(F.careerEarn||0)+total;
  F.lastEarn={show:show,win:winb,venum:venum,bonus:bonus,ppv:ppv,total:total,notes:notes};
}

}
function climbToSmart(ref,dominant){

function lossDrop(ref,kind,close){
  var pi=playerIdx();if(pi<0)return false;
  var oi=RANK.indexOf(ref),moved=false;
  if(oi>pi){RANK.splice(oi,1);RANK.splice(pi,0,ref);moved=true;pi=playerIdx();}
  var drop=close?0:((kind==='ko'||kind==='sub')?rnd(2,4):rnd(1,2));
  if(drop>0&&pi>=0){var np=Math.min(RANK.length-1,pi+drop);var me=RANK.splice(pi,1)[0];RANK.splice(np,0,me);moved=true;}
  return moved;
}
function npcBout(a,b){return (a.ovr*(0.7+Math.random()*0.6))>=(b.ovr*(0.7+Math.random()*0.6))?a:b;}
function shuffleDivision(name,rounds,champTurn){
  if(!DIVSTATE[name])genDivision(name);
  var R=DIVSTATE[name].rank;
  var pIdx=(name===curDivName)?playerIdx():-1;
  for(var n=0;n<rounds;n++){
    var i=Math.floor(Math.random()*R.length);
    var j=Math.min(R.length-1,i+1+Math.floor(Math.random()*3));
    if(i===j)continue;
    if(pIdx>=0 && i<=pIdx && pIdx<=j)continue;
    var hi=R[i],lo=R[j];
    if(!hi||!lo||hi.you||lo.you||hi.ovr==null||lo.ovr==null)continue;
    if(npcBout(hi,lo)===lo){lo.rec[0]++;hi.rec[1]++;R.splice(j,1);R.splice(i,0,lo);}
    else{hi.rec[0]++;lo.rec[1]++;}
  }
  if(champTurn && !(F.belts&&F.belts[name]) && Math.random()<0.16){
    var ch=DIVSTATE[name].champ,c1=R[0];
    if(ch&&c1&&!c1.you&&c1.ovr!=null){
      if(npcBout(ch,c1)===c1){c1.rec[0]++;ch.rec[1]++;DIVSTATE[name].champ=c1;R.splice(0,1,ch);}
      else{ch.rec[0]++;c1.rec[1]++;}
    }
  }
}

function advanceTime(kind,won){
  F.fightCount=(F.fightCount||0)+1;

  F.wear=(F.wear||0)+w;

  if(F.ovr>(F.bestOvr||0))F.bestOvr=F.ovr;

function applyAging(){
  var past=(F.age||22)-(F.primePeak||30);
  if(past<=0)return;
  var durFactor=1.4-(F.durability||70)/140;
  var wearFactor=1+(F.wear||0)/120;
  var dec=Math.max(1,Math.round(past*0.6*durFactor*wearFactor));
  ['poder','velocidade','cardio','queixo'].forEach(function(k){if(F.attrs[k]!=null)F.attrs[k]=Math.max(40,F.attrs[k]-dec);});
  ['precisao','chao','defesa','fightIQ'].forEach(function(k){if(F.attrs[k]!=null&&Math.random()<0.5)F.attrs[k]=Math.max(45,F.attrs[k]-1);});
  if(F.attrs.agressao!=null)F.attrs.agressao=Math.max(45,F.attrs.agressao-Math.round(dec/2));
  recalcOvr();
}

  if(F.retired)return false;

function rollInjury(kind,won,round){

  if(kind==='sub'&&!won)risk+=0.05;
  if(round>=3 && kind==='dec')risk+=0.06;

  risk+=(F.wear||0)/800+Math.max(0,(F.age||25)-32)*0.01;
  if(F.reinjuryRisk)risk+=0.12;
  F.reinjuryRisk=false;
  if(hasTrait('vidro'))risk+=0.1;if(hasTrait('ferro'))risk*=0.5;

  var rr=Math.random();
  var cataP=0.003+((F.age||25)>32?0.008:0)+((F.wear||0)>80?0.015:0)+(hasTrait('vidro')?0.02:0)+((F.durability||70)<65?0.008:0);
  var sev; if(rr<cataP)sev='cata';else if(rr<cataP+0.14)sev='grave';else if(rr<cataP+0.46)sev='moderada';else sev='leve';
  if(sev==='cata'){F.retired=true;F.retireCause='lesao';return;}
  if(sev==='leve'){F.money=Math.max(0,(F.money||0)-Math.round(5000*medFactor()));F.wear=(F.wear||0)+2;F._leveNote=true;return;}

}

  var h='<div class="ladder-h">🏥 SALA DE RECUPERAÇÃO <button class="lx" onclick="closeLadder()">✕</button></div>';
  h+='<div style="padding:12px 16px;color:var(--dim);font-family:Oswald;font-size:12px">Você sofreu: <b style="color:#fff">'+inj.tipo+'</b> (lesão '+inj.sev+'). Carteira: <b style="color:#37d47e">'+fmtMoney(F.money||0)+'</b>.'+(F.stage2==='liga'?' O seguro da Liga cobre metade da conta.':'')+' Escolha a recuperação:</div>';
  h+='<div class="offer"><div class="of-top"><b>Cirurgia + recuperação total</b><span class="of-bonus" style="color:#ff2436">-'+fmtMoney(full)+'</span></div><div class="of-terms">Layoff ~'+inj.meses+' meses · volta 100%'+(inj.perm?' (grave: ainda ~'+inj.perm+' de sequela)':'')+'</div>'+(canFull?'<button class="btn gold sm" onclick="treatInjury(\'full\')">TRATAR ▸</button>':'<div class="of-note" style="color:var(--red2)">Sem dinheiro — precisa de '+fmtMoney(full)+'</div>')+'</div>';
  h+='<div class="offer"><div class="of-top"><b>Tratamento básico</b><span class="of-bonus" style="color:#ff2436">-'+fmtMoney(basic)+'</span></div><div class="of-terms">Layoff curto · sequela leve + risco de reagravar</div>'+(canBasic?'<button class="btn sm" onclick="treatInjury(\'basic\')">FAZER ▸</button>':'<div class="of-note" style="color:var(--red2)">Sem dinheiro — precisa de '+fmtMoney(basic)+'</div>')+'</div>';
  h+='<div class="offer"><div class="of-top"><b>Se virar sozinho</b><span class="of-bonus" style="color:var(--dim)">grátis</span></div><div class="of-terms">Sem médico: muito tempo parado, sequela pesada e alto risco de nova lesão'+(inj.sev==='grave'?' — pode encerrar a carreira':'')+'</div><button class="btn ghost sm" onclick="treatInjury(\'none\')">AGUENTAR NA RAÇA ▸</button></div>';
  showOverlay(h);
}
function treatInjury(mode){
  var inj=F.injuryPending;if(!inj)return;
  var ic=injuryCosts(inj);
  if(mode==='full'){if((F.money||0)<ic.full){toast('Sem dinheiro pra isso');return;}F.money-=ic.full;F.age=(F.age||25)+Math.max(1,Math.round(inj.meses/6));if(inj.perm)hurtAttrs(inj.perm);}
  else if(mode==='basic'){if((F.money||0)<ic.basic){toast('Sem dinheiro pra isso');return;}F.money-=ic.basic;F.age=(F.age||25)+Math.max(0,Math.round(inj.meses/12));hurtAttrs((inj.perm||0)+rnd(1,3));F.reinjuryRisk=true;}
  else{F.age=(F.age||25)+Math.max(1,Math.round(inj.meses/4));hurtAttrs((inj.perm||0)+rnd(3,6));F.reinjuryRisk=true;F.wear=(F.wear||0)+4;if(inj.sev==='grave'&&Math.random()<((F.age||25)>=30?0.12:0.04)){F.retired=true;F.retireCause='lesao';F.injuryPending=null;closeLadder();showRetirement();return;}}
  F.wear=(F.wear||0)+3;F.injuryPending=null;applyAging();
  closeLadder();renderStages();renderFicha();
  if(checkRetire()){showRetirement();return;}
  nextFight();
}
/* ===== FASE 4: ATRIBUTOS NOVOS + TRAÇOS ESPECIAIS ===== */
var TRAITS=[
 {id:'granito',name:'Queixo de Granito',good:1,desc:'Muito resistente a nocaute'},
 {id:'nocauteador',name:'Nocauteador',good:1,desc:'Poder de acabar a luta do nada'},
 {id:'maratonista',name:'Maratonista',good:1,desc:'Cardio infinito, forte no fim'},
 {id:'finalizador',name:'Finalizador',good:1,desc:'Caça finalizações no chão'},
 {id:'ferro',name:'Corpo de Ferro',good:1,desc:'Raramente se machuca'},
 {id:'queridinho',name:'Queridinho da Torcida',good:1,desc:'Vende luta fácil (+carisma)'},
 {id:'explosivo',name:'Explosivo',good:0,desc:'Voa no início, mas cansa'},
 {id:'sangrador',name:'Sangrador',good:-1,desc:'Corta com facilidade'},
 {id:'vidro',name:'Corpo de Vidro',good:-1,desc:'Lesiona com facilidade'},
 {id:'lento',name:'Pé de Chumbo',good:-1,desc:'Reflexos mais lentos'}
];
function rollTraits(){var pool=TRAITS.slice(),out=[],nt=rnd(1,3);for(var i=0;i<nt&&pool.length;i++){var j=Math.floor(Math.random()*pool.length);out.push(pool[j].id);pool.splice(j,1);}return out;}
function hasTrait(id){return F.traits&&F.traits.indexOf(id)>=0;}
function traitName(id){for(var i=0;i<TRAITS.length;i++)if(TRAITS[i].id===id)return TRAITS[i];return null;}
function shareCard(){
  var txt="🥊 "+F.name+" \""+F.nick+"\" — "+F.state+"\n⭐ OVR "+F.ovr+" • "+F.weight+" • Cartel "+F.w+"-"+F.l+"-"+F.d+(F.champion?" • 🏆 CAMPEÃO MUNDIAL":"")+"\nJoga SANGUE NO OCTÓGONO!";
  if(navigator.share){navigator.share({text:txt}).catch(function(){});}
  else if(navigator.clipboard){navigator.clipboard.writeText(txt);toast("Card copiado! Cola no grupo do Zap 📲");}
  else toast("Compartilhe seu cartel!");
}

/* ===== SAVE (localStorage) ===== */
var SAVE_KEY='sno_save_v1',PHASE='create',RESULTVIEW=null;
function saveGame(){
  if(PHASE==='create')return;
  try{
    var co=null;
    if(currentOpp){co={};for(var k in currentOpp)if(k!=='ref')co[k]=currentOpp[k];co.refName=currentOpp.ref?currentOpp.ref.name:null;}
    localStorage.setItem(SAVE_KEY,JSON.stringify({v:2,ts:Date.now(),phase:PHASE,F:F,DIVSTATE:DIVSTATE,cur:curDivName,opp:co,view:RESULTVIEW,last:LASTRES}));
  }catch(e){}
}
function readSave(){try{var raw=localStorage.getItem(SAVE_KEY);if(!raw)return null;var d=JSON.parse(raw);return (d&&(d.v===1||d.v===2)&&d.F&&d.DIVSTATE)?migrateSave(d):null;}catch(e){return null;}}
/* v1 (etapa 1): ranking na escala antiga e sem estilos -> reescala pelo posto, gera estilo/atributos e re-sorteia o oponente. */
function migrateSave(d){
  if(d.v>=2)return d;
  for(var n in d.DIVSTATE){var st=d.DIVSTATE[n];
    st.rank.forEach(function(e,k){if(e.you)return;e.sty=styleFor(e.name);e.a=genAttrs(npcOvrForRank(k),e.sty,3);e.ovr=ovrOf(e.a);});
    if(st.champ){st.champ.sty=styleFor(st.champ.name);st.champ.a=genAttrs(84+rnd(0,3),st.champ.sty,3);st.champ.ovr=ovrOf(st.champ.a);}
  }
  if(d.phase==='prefight'||d.phase==='fight'){d.phase='prefight';d.opp=null;}
  d.F.cs=d.F.cs||{};
  d.v=2;return d;
}
function clearSave(){try{localStorage.removeItem(SAVE_KEY);}catch(e){}}
function resolveRef(n){if(!n)return null;if(CHAMP&&CHAMP.name===n)return CHAMP;var i=rankIndexByName(n);return i>=0?RANK[i]:null;}
function loadGame(){
  var d=readSave();if(!d){renderContinue();return;}
  F=d.F;DIVSTATE=d.DIVSTATE;
  /* o ex-campeão fica no ranking E como champ da divisão: refaz essa referência compartilhada */
  for(var n in DIVSTATE){var st=DIVSTATE[n];if(!st.champ)continue;for(var i=0;i<st.rank.length;i++)if(!st.rank[i].you&&st.rank[i].name===st.champ.name){st.champ=st.rank[i];break;}}
  setDivision(d.cur||F.weight);
  LASTRES=d.last||null;RESULTVIEW=d.view||null;
  currentOpp=d.opp||null;if(currentOpp)currentOpp.ref=resolveRef(currentOpp.refName);
  PHASE=d.phase||'prefight';
  show("scr-game");renderFicha();updateHUD();
  if(PHASE==='result'&&RESULTVIEW)showResult(RESULTVIEW,false);
  else if(F.retired||PHASE==='retired')showRetirement();
  else if(PHASE==='fight'&&currentOpp){simulateFight();skipSim();toast('Você saiu no meio da luta — ela foi decidida sem você no córner.');}
  else if(PHASE==='prefight'&&currentOpp)renderPrefight();
  else nextFight();
}
function renderContinue(){
  var el=document.getElementById("scr-continue"),d=readSave();
  if(!d){el.classList.add("hidden");return;}
  var f=d.F,st=d.DIVSTATE[d.cur],pos;
  if(f.retired||d.phase==='retired')pos='Aposentado';
  else if(f.stage2==='varzea')pos='Circuito de várzea';
  else if(f.stage2==='nacional')pos='Circuito nacional';
  else if(f.belts&&f.belts[d.cur])pos='🏆 Campeão';
  else{pos='sem ranking';if(st)for(var i=0;i<st.rank.length;i++)if(st.rank[i].you){pos='#'+(i+1);break;}}
  el.innerHTML='<div class="sect-h">Carreira salva</div>'+
    '<div class="cont-card"><div class="cont-fig">'+fighterSVG('red')+'</div><div class="cont-info">'+
      '<b>'+cleanName(f.name,20).toUpperCase()+'</b><span>"'+cleanName(f.nick,14)+'"</span>'+
      '<small>'+d.cur+' · '+pos+'<br>Cartel '+f.w+'-'+f.l+'-'+f.d+' · OVR '+f.ovr+' · '+(f.age||22)+' anos</small></div></div>'+
    '<button class="btn gold" onclick="loadGame()">Continuar carreira &#9656;</button>'+
    '<div class="cont-note">ou crie um novo lutador abaixo</div>';
  el.classList.remove("hidden");
}
function askConfirm(msg,okLabel,okJs){
  showOverlay('<div class="ladder-h">CONFIRMAR <button class="lx" onclick="closeLadder()">✕</button></div>'+
    '<div class="confirm-msg">'+msg+'</div>'+
    '<div class="confirm-acts"><button class="btn ghost sm" onclick="closeLadder()">Cancelar</button><button class="btn sm" onclick="closeLadder();'+okJs+'">'+okLabel+'</button></div>');
}
function confirmRestart(){askConfirm('Isso apaga a carreira de <b>'+F.nick+'</b> ('+F.w+'-'+F.l+'-'+F.d+'). Não dá pra desfazer.','APAGAR E RECOMEÇAR','newCareer()');}
function newCareer(){clearSave();location.reload();}

function show(id){
  ["scr-continue","scr-create","scr-game"].forEach(function(s){document.getElementById(s).classList.add("hidden");});
  document.getElementById(id).classList.remove("hidden");window.scrollTo(0,0);
}
var toastT;
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove("show");},2200);}
</script>
