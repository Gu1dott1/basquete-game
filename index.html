<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SANGUE NO OCTÓGONO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#070709; --panel:#111116; --panel2:#181820;
    --red:#e2091c; --red2:#ff2436; --redglow:rgba(226,9,28,.55);
    --blue:#1274ff; --blue2:#3a92ff;
    --gold:#ffbe12; --gold2:#ffe27a;
    --txt:#f4f4f6; --dim:#8b8b98; --line:#2a2a34;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:'Oswald',system-ui,sans-serif;color:var(--txt);background:var(--bg);
    min-height:100vh;overflow-x:hidden;display:flex;justify-content:center}
  .bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .bgfx .glow{position:absolute;top:-20%;left:50%;transform:translateX(-50%);width:150%;height:70%;
    background:radial-gradient(60% 60% at 50% 0%,rgba(226,9,28,.28),transparent 70%)}
  .bgfx .glow2{position:absolute;bottom:-30%;left:-20%;width:80%;height:70%;
    background:radial-gradient(closest-side,rgba(18,116,255,.12),transparent)}
  .bgfx .oct{position:absolute;top:8%;left:50%;transform:translate(-50%,0);width:min(560px,120vw);opacity:.06}
  .bgfx .grid{position:absolute;inset:0;background-image:
    linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
    background-size:44px 44px;-webkit-mask-image:radial-gradient(70% 60% at 50% 30%,#000,transparent);
    mask-image:radial-gradient(70% 60% at 50% 30%,#000,transparent)}
  .app{position:relative;z-index:1;width:100%;max-width:460px;padding:18px 16px 40px}

  .brand{text-align:center;padding:10px 0 22px}
  .brand .kick{font-family:'Barlow Condensed';font-weight:800;font-size:11px;letter-spacing:5px;color:var(--red2)}
  .brand h1{font-family:'Anton';font-size:44px;line-height:.86;letter-spacing:.5px;
    background:linear-gradient(180deg,#fff 30%,#c9c9d2);-webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 6px 30px rgba(226,9,28,.25);transform:skewX(-4deg)}
  .brand h1 .r{background:linear-gradient(180deg,var(--red2),var(--red));-webkit-background-clip:text;background-clip:text;color:transparent}
  .brand .sub{font-family:'Barlow Condensed';font-weight:700;font-size:12px;letter-spacing:4px;color:var(--dim);margin-top:8px}

  .sect-h{font-family:'Barlow Condensed';font-weight:800;font-size:13px;letter-spacing:3px;color:var(--gold);
    text-transform:uppercase;margin-bottom:14px;display:flex;align-items:center;gap:10px}
  .sect-h::before{content:"";width:20px;height:3px;background:var(--red);display:inline-block}

  .panel{background:linear-gradient(180deg,var(--panel),#0d0d12);border:1px solid var(--line);
    border-radius:4px;padding:20px;margin-bottom:14px;position:relative;
    clip-path:polygon(0 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%)}
  .panel::after{content:"";position:absolute;left:0;top:0;width:3px;height:100%;
    background:linear-gradient(180deg,var(--red),transparent)}

  label{display:block;font-family:'Barlow Condensed';font-weight:700;font-size:12px;color:var(--dim);
    margin:16px 0 7px;text-transform:uppercase;letter-spacing:2px}
  input,select{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:3px;
    color:var(--txt);padding:13px;font-size:16px;font-family:'Oswald';outline:none;transition:.15s}
  input::placeholder{color:#55555f}
  input:focus,select:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(226,9,28,.15)}

  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
  .chip{flex:1 1 auto;text-align:center;background:var(--panel2);border:1px solid var(--line);
    border-radius:3px;padding:11px 6px;font-family:'Barlow Condensed';font-weight:700;font-size:14px;
    letter-spacing:1px;cursor:pointer;transition:.15s;text-transform:uppercase;color:var(--dim)}
  .chip:hover{border-color:#444}
  .chip.active{background:linear-gradient(180deg,var(--red2),var(--red));border-color:var(--red2);color:#fff;
    box-shadow:0 4px 16px var(--redglow)}

  .btn{width:100%;border:none;cursor:pointer;margin-top:18px;padding:16px;position:relative;
    font-family:'Barlow Condensed';font-weight:800;font-size:17px;letter-spacing:2px;text-transform:uppercase;
    color:#fff;background:linear-gradient(100deg,var(--red),#a8071a);
    clip-path:polygon(0 0,100% 0,100% 100%,10px 100%,0 calc(100% - 10px));
    box-shadow:0 8px 26px var(--redglow);transition:.12s}
  .btn:active{transform:translateY(2px);box-shadow:0 4px 14px var(--redglow)}
  .btn.gold{background:linear-gradient(100deg,var(--gold),#d99500);color:#231800;box-shadow:0 8px 26px rgba(255,190,18,.4)}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--dim);box-shadow:none;clip-path:none;border-radius:3px}
  .btn.ghost:hover{border-color:var(--red);color:#fff}
  .btn.sm{font-size:14px;padding:12px}
  .hidden{display:none}
  @keyframes slideIn{0%{transform:translateX(30px);opacity:0}100%{transform:translateX(0);opacity:1}}
  .cont-card{display:flex;align-items:center;gap:14px;background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:10px 14px}
  .cont-fig .fig-svg{width:54px;height:72px;display:block;animation:none}
  .cont-info b{display:block;font-family:'Anton';font-size:22px;line-height:1;letter-spacing:.5px}
  .cont-info span{display:block;font-family:'Barlow Condensed';font-weight:800;font-style:italic;color:var(--red2);font-size:15px;margin:2px 0 4px}
  .cont-info small{display:block;font-family:'Barlow Condensed';font-weight:600;font-size:12px;letter-spacing:1px;color:var(--dim);text-transform:uppercase;line-height:1.4}
  .cont-note{text-align:center;font-family:'Barlow Condensed';font-weight:700;font-size:11px;letter-spacing:2px;color:var(--dim);text-transform:uppercase;margin-top:12px}
  .confirm-msg{padding:18px 16px 6px;font-family:'Oswald';font-weight:300;font-size:14px;color:#e8e8ee;line-height:1.5}
  .confirm-msg b{color:#fff;font-weight:600}
  .confirm-acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 16px 16px}
  .confirm-acts .btn{margin-top:0}

  .fcard{position:relative;border-radius:6px;overflow:hidden;padding:22px 20px 20px;
    background:radial-gradient(120% 80% at 50% -10%,rgba(226,9,28,.5),transparent 55%),
      linear-gradient(160deg,#26262f 0%,#141419 45%,#0c0c10 100%);
    border:1px solid #3a3a46;box-shadow:0 20px 50px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06);
    clip-path:polygon(0 0,100% 0,100% 100%,22px 100%,0 calc(100% - 22px))}
  .fcard::before{content:"";position:absolute;inset:0;
    background:repeating-linear-gradient(115deg,transparent,transparent 16px,rgba(255,255,255,.02) 16px,rgba(255,255,255,.02) 17px);pointer-events:none}
  .fcard::after{content:"";position:absolute;top:-40%;left:-30%;width:60%;height:180%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent);transform:rotate(18deg);animation:shine 5s ease-in-out infinite}
  @keyframes shine{0%,100%{left:-40%}50%{left:120%}}
  .fcard .ovr{position:absolute;top:18px;left:20px;line-height:.8}
  .fcard .ovr .n{font-family:'Anton';font-size:52px;color:var(--gold);text-shadow:0 3px 18px rgba(255,190,18,.45)}
  .fcard .ovr .l{font-family:'Barlow Condensed';font-weight:800;font-size:12px;letter-spacing:3px;color:#fff;margin-top:2px}
  .fcard .ovr .pos{font-family:'Barlow Condensed';font-weight:700;font-size:12px;color:var(--red2);letter-spacing:1px}
  .fcard .flag{position:absolute;top:20px;right:20px;background:var(--panel2);border:1px solid var(--line);
    font-family:'Barlow Condensed';font-weight:800;font-size:14px;letter-spacing:1px;padding:4px 10px;border-radius:2px;color:var(--gold2)}
  .fcard .silhouette{text-align:center;font-size:74px;margin:26px 0 6px;filter:drop-shadow(0 8px 20px rgba(0,0,0,.6));position:relative;z-index:1}
  .fcard .fname{font-family:'Anton';font-size:30px;text-align:center;line-height:.9;letter-spacing:.5px;position:relative;z-index:1;transform:skewX(-3deg)}
  .fcard .fnick{font-family:'Barlow Condensed';font-weight:800;font-style:italic;text-align:center;color:var(--red2);
    font-size:16px;letter-spacing:1px;margin:2px 0 4px;position:relative;z-index:1}
  .fcard .meta{text-align:center;font-family:'Barlow Condensed';font-weight:600;font-size:12px;letter-spacing:2px;
    color:var(--dim);text-transform:uppercase;margin-bottom:16px;position:relative;z-index:1}
  .fcard .belt{display:block;text-align:center;font-family:'Barlow Condensed';font-weight:800;letter-spacing:2px;
    color:#231800;background:linear-gradient(180deg,var(--gold2),var(--gold));padding:5px;border-radius:2px;margin-bottom:14px;font-size:13px}
  .attrs{display:grid;grid-template-columns:1fr 1fr;gap:11px 18px;position:relative;z-index:1}
  .attr .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
  .attr .top span{font-family:'Barlow Condensed';font-weight:600;font-size:12px;letter-spacing:1px;color:var(--dim);text-transform:uppercase}
  .attr .top b{font-family:'Anton';font-size:17px;color:#fff}
  .bar{height:5px;background:#000;border-radius:3px;overflow:hidden}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--red2),var(--gold));border-radius:3px;transition:width .6s cubic-bezier(.2,1,.3,1)}

  .stagebar{display:flex;gap:6px;margin:16px 0 4px}
  .stagebar .st{flex:1;text-align:center;font-family:'Barlow Condensed';font-weight:700;font-size:10px;letter-spacing:1px;
    color:#55555f;text-transform:uppercase;padding-bottom:8px;border-bottom:3px solid var(--line);transition:.3s}
  .stagebar .st.on{color:var(--gold);border-color:var(--gold)}
  .stagebar .st.done{color:var(--red2);border-color:var(--red)}
  .record{display:flex;gap:8px;margin:14px 0}
  .rec{flex:1;text-align:center;background:linear-gradient(180deg,var(--panel2),#0e0e13);border:1px solid var(--line);border-radius:3px;padding:11px 4px}
  .rec b{display:block;font-family:'Anton';font-size:26px;line-height:1}
  .rec.w b{color:#37d47e}.rec.l b{color:var(--red2)}.rec.d b{color:var(--dim)}
  .rec span{font-family:'Barlow Condensed';font-weight:700;font-size:10px;letter-spacing:2px;color:var(--dim)}

  .titlefight{text-align:center;font-family:'Barlow Condensed';font-weight:800;letter-spacing:3px;color:var(--gold);
    font-size:14px;margin-bottom:10px;text-transform:uppercase}
  .tape{display:flex;align-items:stretch;background:linear-gradient(180deg,#0e0e13,#080809);
    border:1px solid var(--line);border-radius:4px;overflow:hidden;position:relative}
  .corner{flex:1;padding:16px 10px;text-align:center;position:relative}
  .corner.redc{background:linear-gradient(180deg,rgba(226,9,28,.16),transparent)}
  .corner.bluec{background:linear-gradient(180deg,rgba(18,116,255,.16),transparent)}
  .corner .tag{font-family:'Barlow Condensed';font-weight:800;font-size:10px;letter-spacing:2px}
  .redc .tag{color:var(--red2)} .bluec .tag{color:var(--blue2)}
  .corner .emo{font-size:40px;margin:6px 0;filter:drop-shadow(0 4px 8px rgba(0,0,0,.5))}
  .corner .nm{font-family:'Barlow Condensed';font-weight:800;font-size:15px;line-height:1;letter-spacing:.5px}
  .corner .ov{font-family:'Anton';font-size:34px;margin-top:6px}
  .redc .ov{color:var(--red2)} .bluec .ov{color:var(--blue2)}
  .corner .ovl{font-family:'Barlow Condensed';font-weight:700;font-size:9px;letter-spacing:2px;color:var(--dim)}
  .tape .mid{display:flex;align-items:center;justify-content:center;padding:0 4px;font-family:'Anton';font-size:22px;color:#fff;position:relative}
  .tape .mid span{background:var(--bg);border:2px solid var(--red);border-radius:50%;width:44px;height:44px;
    display:flex;align-items:center;justify-content:center;box-shadow:0 0 20px var(--redglow);transform:skewX(-4deg)}
  .tape-stats{display:flex;flex-direction:column;gap:1px;background:var(--line);margin-top:1px}
  .trow{display:flex;background:var(--panel);font-family:'Barlow Condensed';font-weight:700;font-size:13px}
  .trow>div{flex:1;padding:7px 12px;text-align:center}
  .trow .lbl{flex:0 0 40%;color:var(--dim);font-size:10px;letter-spacing:2px;text-transform:uppercase;display:flex;align-items:center;justify-content:center}
  .trow .rv{color:var(--red2);text-align:right}.trow .bv{color:var(--blue2);text-align:left}

  .result{text-align:center;padding:10px 4px 4px;position:relative}
  .result .banner{font-family:'Barlow Condensed';font-weight:800;letter-spacing:5px;font-size:13px;color:var(--dim)}
  .result .method{font-family:'Anton';font-size:60px;line-height:.85;margin:6px 0;letter-spacing:1px;transform:skewX(-5deg)}
  .method.ko{color:var(--red2);text-shadow:0 0 40px var(--redglow),0 4px 0 #6b0410}
  .method.sub{color:var(--gold);text-shadow:0 0 40px rgba(255,190,18,.6)}
  .method.dec{color:#fff}
  .method.loss{color:#6a6a75}
  .result .rd{font-family:'Barlow Condensed';font-weight:800;letter-spacing:4px;font-size:14px;color:var(--gold2)}
  .result .story{font-family:'Oswald';font-size:14px;color:#cfcfd6;line-height:1.55;margin:16px 6px;font-weight:300}
  .champbanner{font-family:'Anton';font-size:22px;color:#231800;letter-spacing:1px;line-height:1;
    background:linear-gradient(180deg,var(--gold2),var(--gold));padding:12px;border-radius:3px;margin:10px 0;box-shadow:0 8px 30px rgba(255,190,18,.4)}
  .cartel{font-family:'Barlow Condensed';font-weight:700;letter-spacing:1px;color:var(--dim);font-size:14px;margin-top:6px}
  .cartel b{color:#fff;font-size:18px}

  @keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-7px,3px)}40%{transform:translate(6px,-4px)}60%{transform:translate(-5px,-2px)}80%{transform:translate(4px,3px)}}
  .shake{animation:shake .45s ease}
  @keyframes flashwhite{0%{opacity:.85}100%{opacity:0}}
  .whiteflash{position:fixed;inset:0;background:#fff;z-index:99;pointer-events:none;animation:flashwhite .35s ease forwards}
  @keyframes pop{0%{transform:scale(.6) skewX(-5deg);opacity:0}60%{transform:scale(1.08) skewX(-5deg)}100%{transform:scale(1) skewX(-5deg);opacity:1}}
  .pop{animation:pop .4s cubic-bezier(.2,1.3,.4,1)}

  .foot{text-align:center;color:#44444d;font-family:'Barlow Condensed';font-size:10px;letter-spacing:2px;margin-top:16px}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);z-index:100;
    background:var(--panel2);border:1px solid var(--gold);color:var(--gold2);padding:13px 20px;border-radius:4px;
    font-family:'Barlow Condensed';font-weight:700;letter-spacing:1px;font-size:14px;opacity:0;transition:.3s;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .fstage{animation:slideIn .3s ease}
  .round-ind{text-align:center;font-family:'Anton';font-size:22px;color:var(--gold);letter-spacing:1px;margin-bottom:10px}
  .round-ind small{font-family:'Barlow Condensed';font-size:12px;color:var(--dim);letter-spacing:1px}
  .fbars{display:flex;flex-direction:column;gap:10px;margin-bottom:8px}
  .fbtop{display:flex;justify-content:space-between;align-items:baseline;font-family:'Barlow Condensed';font-weight:700;font-size:12px;letter-spacing:1px;margin-bottom:3px}
  .fbtop span{font-family:'Anton';color:#fff;font-size:15px}
  .hpbar{height:13px;background:#000;border:1px solid var(--line);border-radius:3px;overflow:hidden}
  .hpbar i{display:block;height:100%;transition:width .45s cubic-bezier(.2,1,.3,1)}
  .hpbar i.red{background:linear-gradient(90deg,#7a0410,var(--red2))}
  .hpbar i.blue{background:linear-gradient(90deg,#0a3c80,var(--blue2))}
  .stbar{height:4px;background:#000;border-radius:2px;overflow:hidden;margin-top:3px}
  .stbar i{display:block;height:100%;background:linear-gradient(90deg,#b98a00,var(--gold));transition:width .4s}
  .dmgnum{position:absolute;top:38px;font-family:'Anton';font-size:24px;animation:floatup .8s forwards;z-index:3;pointer-events:none}
  .dmgnum.l{left:24px;color:var(--red2)}
  .dmgnum.r{right:24px;color:var(--blue2)}
  @keyframes floatup{0%{opacity:0;transform:translateY(10px) scale(.6)}30%{opacity:1;transform:translateY(-6px) scale(1.25)}100%{opacity:0;transform:translateY(-42px)}}
  .coach{background:var(--panel2);border-left:3px solid var(--gold);border-radius:3px;padding:10px 12px;
    font-family:'Oswald';font-size:13px;font-weight:300;color:#e8e8ee;margin-bottom:10px;min-height:42px;animation:slideIn .3s ease}
  .coach b{color:var(--gold2);font-weight:600}
  .coach .cico{font-size:16px}
  .pbp{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;min-height:18px}
  .pbp .pline{font-family:'Oswald';font-weight:300;font-size:12px;color:var(--dim);padding:5px 9px;background:rgba(255,255,255,.02);border-radius:3px;animation:slideIn .22s ease}
  .pbp .pline:first-child{color:#fff;background:rgba(226,9,28,.09)}
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .actbtn{border:1px solid var(--line);background:linear-gradient(180deg,var(--panel2),#0f0f14);color:#fff;
    border-radius:4px;padding:11px 12px;text-align:left;cursor:pointer;transition:.12s;font-family:'Oswald'}
  .actbtn:hover{border-color:var(--red);transform:translateY(-1px)}
  .actbtn:active{transform:translateY(1px)}
  .actbtn b{display:block;font-family:'Barlow Condensed';font-weight:800;font-size:15px;letter-spacing:.5px;text-transform:uppercase}
  .actbtn span{font-size:10px;color:var(--dim)}
  .scorecard{animation:slideIn .3s ease;text-align:center;padding:8px 0}
  .sc-h{font-family:'Barlow Condensed';font-weight:800;letter-spacing:3px;color:var(--gold);font-size:15px;margin-bottom:16px}
  .sc-legend{font-family:'Barlow Condensed';font-weight:800;font-size:12px;letter-spacing:1px;color:var(--dim);margin:-8px 0 12px}
  .sc-legend .r{color:var(--red2)} .sc-legend .b{color:var(--blue2)}
  .sc-grid{display:grid;grid-template-columns:auto repeat(3,1fr);gap:5px;max-width:360px;margin:0 auto 14px}
  .sc-c{background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:8px 4px;text-align:center;animation:slideIn .25s ease;font-family:'Anton';font-size:18px;color:#7a7a85}
  .sc-c b{font-weight:400}
  .sc-c b.win{color:var(--red2)} .sc-c b.bwin{color:var(--blue2)}
  .sc-hd{background:transparent;border:none;padding:2px 4px;animation:none;font-family:'Barlow Condensed';font-weight:700;font-size:11px;letter-spacing:1px;color:var(--dim);text-transform:uppercase}
  .sc-rd{font-family:'Barlow Condensed';font-weight:700;font-size:11px;letter-spacing:1px;color:var(--dim);text-align:left;padding:8px 10px;display:flex;align-items:center}
  .sc-tot{border-color:var(--gold);background:linear-gradient(180deg,rgba(255,190,18,.10),var(--panel2))}
  .sc-tot.sc-rd{color:var(--gold)}
  .sc-verdict{font-family:'Anton';font-size:21px;letter-spacing:1px;min-height:28px;color:#fff;line-height:1.1}
  .sc-verdict.win{color:var(--gold)} .sc-verdict.loss{color:var(--red2)}
  .divlabel{text-align:center;font-family:'Barlow Condensed';font-weight:700;letter-spacing:3px;color:var(--dim);font-size:12px;margin-bottom:10px;text-transform:uppercase}
  .rankbar{display:flex;align-items:center;justify-content:space-between;margin:14px 0 4px;background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:10px 14px}
  .rankpos{font-family:'Anton';font-size:18px;color:var(--gold)}
  .rankbtn{background:transparent;border:1px solid var(--line);color:var(--dim);font-family:'Barlow Condensed';font-weight:700;letter-spacing:1px;font-size:12px;padding:7px 12px;border-radius:3px;cursor:pointer}
  .rankbtn:hover{border-color:var(--red);color:#fff}
  .ladder{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.74);display:flex;align-items:flex-start;justify-content:center;padding:24px 14px;overflow-y:auto}
  .ladder.hidden{display:none}
  .ladder-box{width:100%;max-width:440px;background:linear-gradient(180deg,#14141a,#0b0b0f);border:1px solid var(--red);border-radius:6px;overflow:hidden;animation:slideIn .3s ease}
  .ladder-h{font-family:'Barlow Condensed';font-weight:800;letter-spacing:2px;color:var(--gold);font-size:15px;padding:15px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}

/* ===== CALENDÁRIO =====
   O tempo corre em semanas (semana 0 = 1ª semana de jan/2026). Camp, descanso, suspensão médica e lesões
   empurram a próxima luta; a idade (aniversário) e o mundo (um "ano" de NPCs) andam com o calendário. */
var MESES=['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'];
function weekYear(w){return 2026+Math.floor((w||0)/52);}
function weekMonth(w){var x=(((w||0)%52)+52)%52;return Math.min(11,Math.floor(x/52*12));}
function dateStr(w){if(w==null)w=F.wk||0;return MESES[weekMonth(w)]+'/'+weekYear(w);}
function passWeeks(n){
  n=Math.round(n||0);if(n<=0)return;
  var w0=F.wk||0,w1=w0+n;F.wk=w1;
  for(var w=w0+1;w<=w1;w++){
    var wy=((w%52)+52)%52;
    if(wy===((F.bday||0)%52)){F.age=(F.age||22)+1;applyAging();}
    if(wy===0)yearTick();
  }
}

function fansAfter(won,kind,r,o){

  if(won===true)pct=0.08+(fin?0.12:0)+(kind==='ko'&&r.round===1?0.25:0);

/* ===== SAÚDE: o queixo se gasta =====
   Cada nocaute sofrido, knockdown e sparring pesado somam dano acumulado (cte). A cada 10 pontos o queixo cai 2,
   de vez. O médico avisa em 40/60/80; perto de 95 a comissão atlética não renova a licença. */
function healthTxt(){var c=F.cte||0;return c<25?'🧠 Saúde ótima':(c<45?'🧠 Saúde boa':(c<65?'⚠️ Saúde: atenção':(c<85?'🟠 Saúde: risco':'🔴 Saúde: perigo')));}
/* (dano acumulado: nocaute sofrido +8, TKO +4, cada knockdown +1,5, sparring por luta conforme a academia) */
function addCte(n){
  F.cte=(F.cte||0)+n;
  var pen=Math.floor(F.cte/12)*2,d=pen-(F.ctePen||0);
  if(d>0){F.ctePen=pen;F.attrs.queixo=Math.max(35,F.attrs.queixo-d);recalcOvr();}
  [45,65,85].forEach(function(lv){F.cteWarn=F.cteWarn||{};if(F.cte>=lv&&!F.cteWarn[lv]){F.cteWarn[lv]=1;pushPend({t:'medico',lv:lv});}});
}
function cteAfterFight(won,kind,r){
  var o=GF?GF.O.s:null,n=0;
  if(won===false&&kind==='ko')n+=8;else if(won===false&&kind==='tko'&&!r.towel&&!r.cut&&!r.legs)n+=4;
  if(o)n+=1.5*(o.kd||0);
  if(GF&&GF.Y.hp<30)n+=1;
  if(n)addCte(n);
  if((F.cte||0)>=100||((F.cte||0)>=95&&won===false&&kind==='ko')){F.retired=true;F.retireCause='saude';}
}

  if(serious&&o.interim&&F.interim){F.interim=null;msg+=' O cinturão interino foi retirado.';}

function impactW(s,w){return s.ss*0.25*w.ss+s.dmg*0.4*w.dmg+s.kd*10*w.dmg+s.td*3.5*w.ctrl+s.ctrl/30*1.5*w.ctrl+s.sub*2.5;}
function judgeOne(diff,yAhead,kdDiff){
  var p=diff+R(-BAL.judgeNoise,BAL.judgeNoise),y=10,o=10;
  if(Math.abs(p)<0.5){if(yAhead)o=9;else y=9;}
  else if(p>0)o=(p>BAL.judge108||kdDiff>=2?8:9);else y=(-p>BAL.judge108||kdDiff<=-2?8:9);
  return {y:y,o:o};
}
function judgeRoundW(Y,O){var out=[],js=GF.judges||[];for(var j=0;j<3;j++){var w=js[j]?js[j].w:{ss:1,dmg:1,ctrl:1};out.push(judgeOne(impactW(Y.r,w)-impactW(O.r,w)+(GF.homeBias||0),Y.hp>=O.hp,Y.r.kd-O.r.kd));}return out;}

function switchDivision(name){
  if(name===curDivName){closeLadder();return;}
  if(PHASE==='fight'||PHASE==='prefight'){toast(PHASE==='fight'?'Termine a luta primeiro':'Você já tem luta marcada');return;}
  if(F.stage2==='prime'||F.tryout){toast(F.tryout?'Termine a seletiva/reality primeiro':'Na PRIME FC você luta na divisão do contrato');return;}
  var od=curDivName, oldRank=playerRank(), wasChamp=F.champion;
  var adjacent=Math.abs(divIndex(name)-divIndex(od))===1&&sameG(name,od);
  if(DIVSTATE[od])DIVSTATE[od].rank=DIVSTATE[od].rank.filter(notYou);
  F.weight=name;F.lastLossTo=null;F.unrankedWins=0;F.superFight=false;
  setDivision(name);
  if(F.champion){
    F.debutStrength=null;
    toast('De volta aos '+name.toUpperCase()+' — hora de defender o cinturão! 🏆');
  } else if(wasChamp && adjacent){
    F.superFight=true;F.debutStrength='strong';
    toast('SUPERLUTA pelo cinturão dos '+name.toUpperCase()+'! O dos '+od.toUpperCase()+' segue com você 🏆');
  } else {
    F.debutStrength=(wasChamp||oldRank<=8)?'strong':'weak';
    toast('Divisão dos '+name.toUpperCase()+' — '+(F.debutStrength==='strong'?'estreia contra alguém do ranking!':'comece de baixo, prove seu valor.'));
  }
  closeLadder();renderStages();renderFicha();nextFight();
}

function scoutNotes(){
  var o=currentOpp,S=STY[o.sty]||STY.completo,Y=F.attrs,O=o.a,n=[];
  n.push('<b>'+S.ico+' '+S.nome+':</b> '+S.blurb+'.');
  if(o.peak)n.push('🔥 Fez o melhor camp da carreira pra tirar seu cinturão: chega mais forte que o normal.');
  var best=null,worst=null;
  ATTRS.forEach(function(x){var d=Y[x.key]-O[x.key];if(!best||d>best.d)best={l:x.label,d:d};if(!worst||d<worst.d)worst={l:x.label,d:d};});
  if(best.d>=4)n.push('✅ Sua maior vantagem: <b>'+best.l+'</b> (+'+best.d+').');
  if(worst.d<=-4)n.push('⚠️ Maior vantagem dele: <b>'+worst.l+'</b> (+'+(-worst.d)+').');
  if(O.chao-Y.chao>=10)n.push(S.sub>=1.2?'🐍 Finalizador perigoso: não fique por baixo.':'🤼 Domina no chão: cuidado com as quedas.');
  else if(Y.chao-O.chao>=10)n.push('🤼 Você é muito melhor no chão: a queda é uma arma.');
  if(O.poder>=Y.queixo+10)n.push('💥 Mão pesada demais pro seu queixo.');
  if(O.queixo<=Y.poder-10)n.push('🎯 Queixo dele é alvo: dá pra nocautear.');
  if(O.cardio<=Y.cardio-8)n.push('🫁 Gás fraco: a luta longa favorece você.');
  else if(Y.cardio<=O.cardio-8)n.push('🫁 Ele tem mais gás: não deixe a luta arrastar.');
  var rd=(F.reach||0)-(o.rch||0);
  if(o.rch&&F.reach&&rd>=6)n.push('📏 Você alcança '+rd+' cm a mais: de longe, a vantagem é sua.');
  else if(o.rch&&F.reach&&rd<=-6)n.push('📏 Ele alcança '+(-rd)+' cm a mais: encurte a distância.');
  if(o.stn==='Canhoto'&&F.stance!=='Canhoto')n.push((F.southFought||0)>=4?'🔄 Ele é canhoto, mas você já está calejado contra canhotos.':'🔄 Ele é canhoto: a esquerda dele vem de onde você não está acostumado'+((F.southFought||0)?' (você já enfrentou '+F.southFought+')':'')+'.');
  else if(F.stance==='Canhoto'&&o.stn!=='Canhoto')n.push(southExpO(o)>0.6?'🔄 Você é canhoto: ele quase nunca treina contra isso.':'🔄 Você é canhoto, mas ele é rodado e já viu muito canhoto.');
  n.push('🧠 Plano provável dele: <b>'+planLabel(likelyPlan({a:O,sk:o.sty},{a:Y,sk:PLAYER_STY[F.style]}))+'</b>.');
  return n.map(function(x){return '<div>'+gtxt(x,o.fem)+'</div>';}).join('');
}

function resortDivision(d){

  var npcs=rk.filter(notYou);
  npcs.forEach(function(e){e._k=e.ovr+R(-BAL.wNoise,BAL.wNoise);});
  npcs.sort(function(a,b){return b._k-a._k;});
  npcs.forEach(function(e){delete e._k;});

function npcBout(a,b){return (a.ovr*(0.82+Math.random()*0.36))>=(b.ovr*(0.82+Math.random()*0.36))?a:b;}
function shuffleDivision(name,rounds,champTurn,news){
  if(!DIVSTATE[name])genDivision(name);
  var R=DIVSTATE[name].rank;
  var pIdx=(name===curDivName)?playerIdx():-1;
  for(var n=0;n<rounds;n++){
    var i=Math.floor(Math.random()*R.length);
    var j=Math.min(R.length-1,i+1+Math.floor(Math.random()*3));
    if(i===j)continue;
    if(pIdx>=0 && i<=pIdx && pIdx<=j)continue;
    var hi=R[i],lo=R[j];
    if(!hi||!lo||hi.you||lo.you||hi.ovr==null||lo.ovr==null)continue;
    if(npcBout(hi,lo)===lo){lo.rec[0]++;hi.rec[1]++;R.splice(j,1);R.splice(i,0,lo);
      if(news&&i<10&&hi.ovr-lo.ovr>=3)news.push({p:1,txt:'Zebra nos '+name+': '+lo.name+' (#'+(j+1)+') vence '+hi.name+' (#'+(i+1)+').',ico:'🦓',div:name});}
    else{hi.rec[0]++;lo.rec[1]++;}
  }
  var ch0=DIVSTATE[name].champ,c10=R[0],gapC=(c10&&!c10.you&&ch0)?c10.ovr-ch0.ovr:0;
  if(champTurn && !(F.belts&&F.belts[name]) && Math.random()<BAL.wTitle+(gapC>=5?0.3:0)){
    var ch=DIVSTATE[name].champ,c1=R[0];
    if(ch&&c1&&!c1.you&&c1.ovr!=null){
      if(npcBout(ch,c1)===c1){c1.rec[0]++;ch.rec[1]++;DIVSTATE[name].champ=c1;R.splice(0,1,ch);if(news)news.push({p:3,txt:'NOVO CAMPEÃO dos '+name+': '+c1.name+' derrota '+ch.name+'!',ico:'👑',div:name});if(name===curDivName)CHAMP=c1;}
      else{ch.rec[0]++;c1.rec[1]++;if(news)news.push({p:2,txt:ch.name+' defende o cinturão dos '+name+' contra '+c1.name+'.',ico:'🏆',div:name});}
    }
  }
}

function ovrOf(a){var s=0;ATTRS.forEach(function(x){s+=a[x.key];});return Math.round(s/ATTRS.length);}
/* Gera atributos com a forma do estilo e média = ovr. */
function genAttrs(ovr,sk,spread){
  var P=(STY[sk]||STY.completo).prof,a={},sum=0;
  ATTRS.forEach(function(x){var v=ovr+(P[x.key]||0)+(spread?rnd(-spread,spread):0);a[x.key]=v;sum+=v;});
  var shift=ovr-sum/ATTRS.length;
  ATTRS.forEach(function(x){a[x.key]=Math.max(30,Math.min(99,Math.round(a[x.key]+shift)));});
  return a;
}

  if(GF.result)return;

function drain(f,mult){var d=BAL.drain*mult*(1.4-(f.a.cardio||60)/120)*pm(f,'drain');if(hasT(f,'maratonista'))d*=0.7;if(hasT(f,'explosivo')&&GF.round>=3)d*=1.3;f.st=Math.max(0,f.st-d);}
function initW(f){var m=mob(f);return (35+(f.a.agressao||55)*0.65)*PLANS[f.plan].init*(f.rocked>0?0.45:1)*(0.6+0.4*f.st/100)*m*(f.plan==='pressao'?m*m:1)*(hasT(f,'explosivo')&&GF.round<=1?1.15:1);}

function volume(f,o){var n=Math.round(R(2,6)*((f.a.agressao||55)/70)*Math.sqrt(PLANS[f.plan].init)*(0.5+0.5*f.st/100));if(n<=0)return;f.r.sa+=n;f.r.ss+=Math.round(n*clamp(0.42+((f.a.precisao||60)-(o.a.defesa||60))/200,0.15,0.7));}
function dealDmg(A,D,dmg){D.hp-=dmg;A.r.dmg+=dmg;if(D.hp<=0&&!GF.result){D.hp=0;finish('tko',A,{});return true;}return false;}
function cutCheck(A,D,dmg){
  if(dmg<6||GF.result)return;
  var p=0.025+(100-(D.dur||70))/1500;p*=(Sf(A).cutx||1);if(hasT(D,'sangrador'))p*=2.2;if(hasT(D,'granito'))p*=0.6;
  if(Math.random()>=p)return;
  D.cut++;
  if(D.cut>=3){snap(say('doc',A,D),{hit:who(D),by:who(A),act:'cut'});finish('tko',A,{cut:true});return;}
  snap(say(D.cut>=2?'cutBad':'cut',A,D),{hit:who(D)});
}
function knockdownCheck(A,D,dmg,isCounter,tec){
  var p=(dmg/100)*Math.pow((A.a.poder||60)/70,1.3)*(0.7+(A.a.precisao||60)/230)*(1.5-(D.a.queixo||60)/100)*(D.hp<40?1.7:1)*(D.rocked>0?1.8:1)*(isCounter?1.35:1)*BAL.kd;
  p*=(Sf(A).kdx||1);if(hasT(A,'nocauteador'))p*=1.8;if(hasT(D,'granito'))p*=0.45;
  if(Math.random()>=p)return 0;
  A.r.kd++;D.kdR++;D.rocked=2;D.mo=Math.max(-3,D.mo-2);
  var extra=rnd(4,9);
  /* nocaute na hora: golpe muito forte ou queixo já mexido */
  var flash=clamp(0.18+(dmg-10)/40+(D.kdR-1)*0.2-((D.a.queixo||60)-60)/200,0.05,0.6);
  if(Math.random()<flash){snap(say('ko',A,D,tec),{hit:who(D),dmg:Math.round(dmg),kd:who(D),by:who(A),act:tecToAct(tec),tgt:tecTarget(tec),fin:'ko'});D.hp=Math.max(0,D.hp-extra);finish('ko',A,{});return 2;}
  snap(say('kd',A,D,tec),{hit:who(D),dmg:Math.round(dmg),kd:who(D),by:who(A),act:tecToAct(tec),tgt:tecTarget(tec)});
  if(dealDmg(A,D,extra+dmg))return 2;
  var fp=0.28+((A.a.agressao||55)-55)/220+((A.a.poder||60)-(D.a.queixo||60))/260-((D.a.coracao||55)-55)/130+(D.kdR-1)*0.18+(D.hp<30?0.15:0);
  if(Math.random()<clamp(fp*(GF.refStop||1),0.06,0.88)||D.kdR>=3){snap(say('tkoKd',A,D),{hit:who(D)});finish('tko',A,{});return 2;}
  snap(say('kdSurv',A,D));
  return 1;
}
function strike(A,D,isCounter){
  if(GF.result)return;
  var tec=pick(Sf(A).tec);
  var off=((A.a.precisao||60)*0.48+(A.a.velocidade||60)*0.25+(A.a.fightIQ||55)*0.15+(A.a.poder||60)*0.12)*sf(A)*mob(A)*(1+A.mo*0.025)*traitOut(A);
  var def=((D.a.defesa||60)*0.47+(D.a.velocidade||60)*0.26+(D.a.fightIQ||55)*0.27)*sf(D)*mob(D)*Math.sqrt(heart(D));
  var dDef=pm(D,'def');if(D.plan==='distancia'&&A.plan==='pressao')dDef=-0.02;
  var land=clamp(BAL.land+(off-def)/90+pm(A,'acc')-dDef+0.045*edge(A,D)+(isCounter?0.1:0)+(D.rocked>0?0.15:0)+tapeEdge(A,D)-(A.blur>0?0.07:0),0.12,0.88);
  var n=rnd(4,9);A.r.sa+=n;
  var landed=Math.random()<land;
  if(landed){
    var hits=Math.max(1,Math.round(n*R(0.4,0.7)));A.r.ss+=hits;
    var dmg=(3.5+(A.a.poder||60)*0.07)*R(0.55,1.45)*pm(A,'dmg')*(isCounter?1.15:1)*heart(A)*killer(A,D)*traitOut(A)*chinRes(D);
    A.mo=Math.min(4,A.mo+1);D.mo=Math.max(-3,D.mo-1);
    var kd=knockdownCheck(A,D,dmg,isCounter,tec);
    if(kd===2)return;
    if(kd===0){
      if(isCounter)snap(say('counter',A,D,tec),{hit:who(D),dmg:Math.round(dmg),by:who(A),act:tecToAct(tec),tgt:tecTarget(tec)});
      else snap(say(dmg>=12?'heavy':'land',A,D,tec),{hit:who(D),dmg:Math.round(dmg),by:who(A),act:tecToAct(tec),tgt:tecTarget(tec)});
      if(dealDmg(A,D,dmg))return;
    }
    if(dmg>=13&&!D.rocked&&Math.random()<0.35){D.rocked=1;snap(say('rocked',A,D));}
    cutCheck(A,D,dmg);
  } else {A.r.ss+=Math.round(n*R(0.05,0.25));if(!GF.quiet&&Math.random()<0.45)snap(say('miss',A,D,tec),{by:who(A),act:tecToAct(tec),miss:true});}
  if(!isCounter&&!GF.result){
    var cp=0.05*(landed?0.6:1.6)*(1-0.35*edge(A,D))*pm(D,'ctr')*pm(A,'exp')*(1+(((D.a.velocidade||60)+(D.a.precisao||60)+(D.a.fightIQ||55))/3-((A.a.defesa||60)+(A.a.fightIQ||55))/2)/120)*(1+((A.a.agressao||55)-55)/300)*(D.rocked>0?0.3:1);
    if(Math.random()<cp)strike(D,A,true);
  }
}
/* envergadura: quem alcança mais acerta mais de longe (a pressão encurta a distância); canhoto x destro:

function gfRound(planY){

  }

  if(GF.result&&GF.result.pendingTech){

/* ---------- IA do oponente: estilo + situação + adaptação ao seu plano anterior (Fight IQ) ---------- */
function aiWeights(me,op,situ){

  var dg=(me.a.chao||50)-(op.a.chao||50);
  if(dg>10)w.chao*=1.6;else if(dg<-10){w.chao*=0.35;w.distancia*=1.5;w.perna*=0.6;}
  if(situ){
    var behind=(me===GF.Y)?(GF.rWinO>GF.rWinY):(GF.rWinY>GF.rWinO);
    if(behind){w.pressao*=1.7;if(dg>0)w.chao*=1.4;}
    if(me.hp<35&&me.sk!=='trocador'){w.contra*=1.5;w.distancia*=1.5;w.pressao*=0.6;}
    if(op.hp<40)w.pressao*=2.2;

    if(op.lastPlan||(op.plan&&GF.round>1)){var c=plansThatBeat(op.lastPlan||op.plan),ad=Math.max(0,((me.a.fightIQ||55)-45)/35);c.forEach(function(x){w[x]*=1+ad;});}

function gfResolve(){
  if(GF.result)return;

  GF.cards.forEach(function(rc){for(var j=0;j<3;j++){tot[j][0]+=rc[j].y;tot[j][1]+=rc[j].o;}});
  var yJ=0,oJ=0,dJ=0,minMargin=99;
  tot.forEach(function(t){var m=t[0]-t[1];if(m>0)yJ++;else if(m<0)oJ++;else dJ++;minMargin=Math.min(minMargin,Math.abs(m));});

  else{kind='dec';won=yJ>oJ;type=(Math.max(yJ,oJ)===3?'unanime':(dJ===1?'majoritaria':'dividida'));}
  GF.result={kind:kind,won:won,round:GF.rounds,time:'5:00',cards:GF.cards,totals:tot,decType:type,close:(type!=='unanime'||minMargin<=1),judgeNames:GF.judgeNames||null};

/* ===================== LUTA NA TELA ===================== */
var simTimer=null,GF=null;
function fighterDefY(){return {name:F.nick,a:applyMods(applyMods(F.attrs,currentOpp&&currentOpp.ymods),pedMods()),sty:PLAYER_STY[F.style]||'completo',tr:(F.traits||[]).slice(),dur:F.durability||70,isY:true,rch:F.reach||0,stn:F.stance||'Destro',sx:southExpY()};}
function fighterDefO(o){o=o||currentOpp;return {name:o.name,a:applyMods(o.a,o.omods),sty:o.sty,tr:[],dur:o.dur||75,rch:o.rch||0,stn:o.stn||'Destro',sx:southExpO(o)};}
/* main event da Liga: 5 rounds, com ou sem cinturão (como no UFC) */
function isMainEvent(o){return !!(o&&!o.circuit&&!o.tryout&&o.event&&o.event.slot==='MAIN EVENT');}
function fightRounds(o){return (o.title||o.primeTitle||o.interim||o.bmf||isMainEvent(o))?5:3;}
function gfStart(){GF=newFight(fighterDefY(),fighterDefO(),fightRounds(currentOpp));GF.oR1=currentOpp.oR1||null;GF.homeBias=(currentOpp.city&&currentOpp.city.home)?(currentOpp.circuit?0.8:1.5):0;
  var ev=currentOpp.event;if(ev&&ev.ref!=null){var rf=REFS[ev.ref];GF.refStop=rf.stop;GF.refStrict=rf.strict;GF.judges=ev.judges.map(function(i){return JUDGE_POOL[i];});GF.judgeNames=GF.judges.map(function(j){return j.n;});}}
function prefightCoach(){var saved=GF;gfStart();var b=coachBest(BAL.coachPre);GF=saved;return b;}
function planLabel(k){var p=PLANS[k];return p?p.ico+' '+p.nome:'—';}
function fmtCtrl(s){s=Math.round(s||0);return Math.floor(s/60)+':'+('0'+(s%60)).slice(-2);}
function planButtons(fn,best,cur){
  return PLAN_KEYS.map(function(k){var p=PLANS[k];
    return '<button class="cbtn'+(k===best?' sug':'')+(k===cur?' cur':'')+'" data-plan="'+k+'" onclick="'+fn+'(\''+k+'\')">'+
      (k===best?'<i class="star">⭐ TREINADOR</i>':'')+'<b>'+p.ico+' '+p.nome+'</b><span>'+p.desc+'</span></button>';}).join('');
}
function markPlan(k){var bs=document.querySelectorAll?document.querySelectorAll('.cbtn[data-plan]'):[];for(var i=0;i<bs.length;i++){if(bs[i].getAttribute('data-plan')===k)bs[i].classList.add('cur');else bs[i].classList.remove('cur');}}
/* linhas "você | atributo | ele" (o maior fica destacado) */
function cmpRow(label,y,o,yTxt,oTxt){return '<div class="trow"><div class="rv'+(y>o?' adv':'')+'">'+(yTxt!=null?yTxt:y)+'</div><div class="lbl">'+label+'</div><div class="bv'+(o>y?' adv':'')+'">'+(oTxt!=null?oTxt:o)+'</div></div>';}
function statsRows(y,o){
  return cmpRow('Golpes sig.',y.ss,o.ss,y.ss+'/'+y.sa,o.ss+'/'+o.sa)+
    (y.kd||o.kd?cmpRow('Knockdowns',y.kd,o.kd):'')+
    cmpRow('Quedas',y.td,o.td,y.td+'/'+y.tda,o.td+'/'+o.tda)+
    cmpRow('Controle',y.ctrl,o.ctrl,fmtCtrl(y.ctrl),fmtCtrl(o.ctrl))+
    (y.sub||o.sub?cmpRow('Tent. finalização',y.sub,o.sub):'')+
    (y.legk||o.legk?cmpRow('Chutes na perna',y.legk,o.legk):'');
}
function fightStatsHtml(st,open){
  if(!st)return '';
  return '<details class="fstats"'+(open?' open':'')+'><summary>📊 ESTATÍSTICAS DA LUTA</summary><div class="tape-stats">'+
    cmpRow('',0,0,'<b>'+F.nick.toUpperCase()+'</b>','<b>'+(st.on||'').toUpperCase()+'</b>')+statsRows(st.y,st.o)+'</div></details>';
}
function simulateFight(plan){
  plan=plan||currentOpp.plan||currentOpp.coach||'equilibrado';
  PHASE='fight';saveGame();
  gfStart();SND.crowdStart();LASTPOS='pe';
  document.getElementById("fight-area").innerHTML=
    '<div class="fstage">'+
      '<div class="round-ind"><span id="ri">ROUND 1</span> <small id="risub">de '+GF.rounds+'</small></div>'+
      '<div class="fbars">'+fbar('you',F.nick.toUpperCase(),'red')+fbar('opp',currentOpp.name.toUpperCase(),'blue')+'</div>'+
      '<div class="planline" id="planline">'+planLabel(plan)+'</div>'+
      '<div class="ring arena" id="ring">'+arenaMarkup('arF',lookOf('red'),lookOf('blue'),bodyW(F.weight))+'<div class="ringtag" id="ringtag"></div><div id="fx"></div></div>'+
      '<div id="corner"></div>'+
      '<div class="pbp" id="pbp"></div>'+
      '<button class="btn ghost sm" onclick="skipSim()">Pular para o resultado &#9656;</button>'+
    '</div>';
  updateBarsRaw(100,100,100,100);
  FIGHT_ARENA=arenaCreate('arF');
  pbp('🔔 E COMEÇA A LUTA!');
  simTimer=setTimeout(function(){runRound(plan);},700);
}
var LASTPOS='pe';
function runRound(plan){var events=gfRound(plan);playEvents(events,afterRound);}
function playEvents(events,cb){
  var i=0;
  function step(){
    if(i>=events.length){cb();return;}
    var e=events[i++];applyEvent(e);
    var delay=(e.type==='round'?800:(e.kd?1450:(e.dmg>=12?850:520)))*speed();
    simTimer=setTimeout(step,delay);
  }
  step();
}
function afterRound(){
  if(GF.result){revealFinishGF();return;}
  if(GF.round>=GF.rounds){gfResolve();revealFinishGF();return;}
  var Y=GF.Y,O=GF.O;
  updateBarsRaw(Y.hp,O.hp,Y.st,O.st);
  setChips({yl:Y.leg,ol:O.leg,yc:Y.cut,oc:O.cut,yr:false,or:false,ys:Y.st,os:O.st});
  setGround('pe');
  showCorner();
}
function revealFinishGF(){
  if(!GF||GF.revealed)return;GF.revealed=true;
  var res=GF.result;
  arenaFinish(res);
  updateBarsRaw(GF.Y.hp,GF.O.hp,GF.Y.st,GF.O.st);
  if(res.kind==='ko'||res.kind==='tko'||res.kind==='sub')SND.roar();
  var view=endFight(res,true);
  setTimeout(function(){presentResult(res,view,view._ko);},isDecision(res.kind)?700:1500);
}
function coachRead(){
  var Y=GF.Y,O=GF.O,lr=GF.rs[GF.rs.length-1],ly=lr.y,lo=lr.o,m=[];
  if(Y.hp<30)m.push('Você tá muito machucado! Mais um round assim e eu jogo a toalha.');
  else if(O.hp<35)m.push('Ele tá caindo aos pedaços — dá pra acabar com isso!');
  if(Y.st<30)m.push('Você tá sem gás, respira e escolhe bem onde gastar.');
  else if(O.st<30)m.push('Ele tá morto de cansado.');
  if(O.leg>=50)m.push('A perna dele tá destruída.');
  if(Y.leg>=50)m.push('Tua perna tá machucada, cuidado com os chutes.');
  if(ly.tda>=2&&ly.td===0)m.push('Ele tá defendendo todas as quedas.');
  if(lo.td>=1&&lo.ctrl>=40)m.push('Ele te levou pro chão e controlou — cuidado com a grade.');
  if(O.cut>0)m.push('Ele tá sangrando, o corte pode parar a luta.');
  var d=GF.rWinY-GF.rWinO;
  m.push(d>0?'Acho que tamo na frente ('+GF.rWinY+'-'+GF.rWinO+').':(d<0?'Acho que tamo atrás ('+GF.rWinY+'-'+GF.rWinO+') — precisa virar.':'Placar empatado, esse round decide.'));
  m.push('Ele veio com <b>'+planLabel(O.plan)+'</b>.');
  return gtxt(m.slice(0,4).join(' '),currentOpp&&currentOpp.fem);
}
function showCorner(){
  var el=document.getElementById('corner');if(!el)return;
  el.className='corner-live';if(el.scrollIntoView){try{el.scrollIntoView({block:'center',behavior:'smooth'});}catch(e){}}
  var best=coachBest(BAL.coachCorner),lr=GF.rs[GF.rs.length-1];
  var h='<div class="corner-read"><span class="cico">🗣️</span> <b>Treinador:</b> '+coachRead()+' Minha sugestão: <b>'+planLabel(best)+'</b>.</div>'+
    '<div class="rmini"><div class="rmini-h">ROUND '+GF.round+'</div><div class="tape-stats">'+statsRows(lr.y,lr.o)+'</div></div>'+
    '<div class="corner-actions">'+planButtons('pickPlan',best,GF.Y.plan)+'</div>'+
    (GF.Y.hp<35?'<button class="btn ghost sm" style="border-color:var(--red);color:var(--red2)" onclick="throwTowel()">🏳️ Jogar a toalha (desistir)</button>':'');
  el.innerHTML=h;
}
function pickPlan(p){if(!GF||GF.revealed)return;var el=document.getElementById('corner');if(el){el.innerHTML='';el.className='';}runRound(p);}
function throwTowel(){if(!GF||GF.revealed)return;GF.result={kind:'tko',won:false,round:GF.round,towel:true};var el=document.getElementById('corner');if(el)el.innerHTML='';pbp('🏳️ O córner jogou a toalha! '+F.nick+' não volta pro próximo round.');revealFinishGF();}
function fbar(who,name,color){
  return '<div><div class="fbtop"><b>'+name+'</b><span class="fchips" id="'+who+'chips"></span><span id="'+who+'hp-n" class="hpn">100</span></div>'+
    '<div class="hpbar"><i id="'+who+'hp" class="'+color+'" style="width:100%"></i></div>'+
    '<div class="stbar" title="Gás"><i id="'+who+'st" style="width:100%"></i></div></div>';
}
function updateBarsRaw(y,o,ys,os){
  var a=document.getElementById("youhp"),b=document.getElementById("opphp");
  if(a)a.style.width=Math.max(0,y)+'%';if(b)b.style.width=Math.max(0,o)+'%';
  var an=document.getElementById("youhp-n"),bn=document.getElementById("opphp-n");
  if(an)an.textContent=Math.max(0,Math.round(y));if(bn)bn.textContent=Math.max(0,Math.round(o));
  if(ys!=null){var c=document.getElementById("youst"),d=document.getElementById("oppst");if(c)c.style.width=Math.max(0,ys)+'%';if(d)d.style.width=Math.max(0,os)+'%';}
}
function chipsHtml(leg,cut,rocked,st){return (rocked?'<i title="Grogue">😵</i>':'')+(cut>0?'<i title="Corte">'+(cut>=2?'🩸🩸':'🩸')+'</i>':'')+(leg>=40?'<i title="Perna machucada">🦵</i>':'')+(st<25?'<i title="Sem gás">🫁</i>':'');}
function setChips(e){
  var a=document.getElementById('youchips'),b=document.getElementById('oppchips');
  if(a)a.innerHTML=chipsHtml(e.yl,e.yc,e.yr,e.ys);if(b)b.innerHTML=chipsHtml(e.ol,e.oc,e.or,e.os);
}
function setGround(pos,top,gp,cl){
  var ring=document.getElementById('ring'),tag=document.getElementById('ringtag');if(!ring)return;
  if(pos==='clinch'){if(tag)tag.textContent='🔒 CLINCH NA GRADE · '+(cl==='you'?F.nick:currentOpp.name).toUpperCase()+' PRESSIONA';}
  else if(pos==='chao'){if(tag)tag.textContent='🤼 '+(top==='you'?F.nick:currentOpp.name).toUpperCase()+' POR CIMA · '+GP_LABEL[gp||0].toUpperCase();}
  else{if(tag)tag.textContent='';}
}
function pbp(m){var el=document.getElementById("pbp");if(!el)return;var d=document.createElement("div");d.className="pline";d.textContent=m;el.insertBefore(d,el.firstChild);while(el.children.length>6)el.removeChild(el.lastChild);}
function floatDmg(who,n){if(!n)return;var fx=document.getElementById('fx');if(!fx)return;var d=document.createElement('div');d.className='dmgnum '+(who==='you'?'l':'r');d.textContent='-'+n;fx.appendChild(d);setTimeout(function(){if(d.parentNode)d.parentNode.removeChild(d);},800);}
function shakeApp(n){if(n>=16){var a=document.getElementById('app');a.classList.add('shake');setTimeout(function(){a.classList.remove('shake');},400);}}
function applyEvent(e){
  if(e.type==='round'){
    var ri=document.getElementById('ri');if(ri)ri.textContent='ROUND '+e.r;
    var rs=document.getElementById('risub');if(rs)rs.textContent='de '+GF.rounds;
    var pl=document.getElementById('planline');if(pl)pl.innerHTML=planLabel(e.yp)+' <span>vs</span> '+planLabel(e.op);
    arenaEvent(e);pbp('🔔 '+e.txt+' — '+(currentOpp&&currentOpp.fem?'ela':'ele')+' vem com '+PLANS[e.op].nome.toLowerCase());updateBarsRaw(e.y,e.o,e.ys,e.os);setGround('pe');LASTPOS='pe';SND.bell(e.r===1?1:2);return;
  }
  if(e.hit)SND.hit(Math.min(1,(e.dmg||4)/20));
  if(e.kd){SND.hit(1);SND.roar();}
  else if(e.dmg>=13)SND.swell(0.16,1.4);
  if(e.pos==='chao'&&LASTPOS!=='chao')SND.thud();
  LASTPOS=e.pos;
  if(e.y<25)SND.heart();
  updateBarsRaw(e.y,e.o,e.ys,e.os);setChips(e);setGround(e.pos,e.top,e.gp,e.cl);
  if(FIGHT_ARENA)FIGHT_ARENA.ts=1/speed();
  arenaEvent(e);
  if(e.hit){var hd=e.hit,dm=e.dmg;setTimeout(function(){floatDmg(hd,dm);shakeApp(dm);},170);}
  pbp(e.txt);
}
function skipSim(){
  if(simTimer)clearTimeout(simTimer);
  if(!GF||GF.revealed)return;
  var el=document.getElementById('corner');if(el){el.innerHTML='';el.className='';}
  var plan=GF.round===0?(currentOpp.plan||currentOpp.coach||'equilibrado'):GF.Y.plan;
  GF.quiet=true;
  var guard=0;while(!GF.result&&GF.round<GF.rounds&&guard<20){gfRound(plan);guard++;}
  gfResolve();GF.quiet=false;
  updateBarsRaw(GF.Y.hp,GF.O.hp,GF.Y.st,GF.O.st);revealFinishGF();
}

function endFight(r,defer){
  var kind=r.kind,won=r.won,round=r.round,close=r.close,tNew=false,tDef=false,tLost=false;
  var o=currentOpp,method,cls,story,ko=false,detail='';
  if(kind==='nc'){F.nc=(F.nc||0)+1;method='SEM RESULTADO';cls='dec';story='Falta acidental interrompeu tudo. Declarada SEM RESULTADO (No Contest) — não conta como vitória nem derrota.';}
  else if(kind==='draw'){F.d++;method=r.tech?'EMPATE TÉCNICO':'EMPATE';cls='dec';detail=r.tech?'FALTA ACIDENTAL · ROUND '+round:DRAW_TXT[r.decType];story='Depois da distância completa, os juízes não separaram os dois. Empate '+DRAW_TXT[r.decType].toLowerCase()+'.';}
  else if(won){
    F.w++;
    if(kind==='ko'){method='NOCAUTE';cls='ko';ko=true;detail='ROUND '+round+(r.time?' · '+r.time:'');story=F.nick+' desligou '+o.name+' no round '+round+'! A arena explodiu.';}
    else if(kind==='tko'){method='NOCAUTE TÉCNICO';cls='ko';ko=true;detail=(r.cut?'CORTE · ':(r.legs?'CHUTES NA PERNA · ':''))+'ROUND '+round+(r.time?' · '+r.time:'');story=r.cut?(F.nick+' abriu um corte feio em '+o.name+' e o médico parou a luta no round '+round+'.'):(F.nick+' castigou '+o.name+' até a luta ser parada no round '+round+'.');}

var STY_GROW={wrestler:['chao','cardio','fightIQ'],jiujitsu:['chao','fightIQ','coracao'],muaythai:['poder','cardio','agressao'],boxe:['precisao','velocidade','defesa'],trocador:['poder','queixo','agressao']};

function naturalGrowth(){
  /* evolução natural anda com o calendário (por ano), não com o número de lutas */
  var age=F.age||22,n=0,done=0,fw=(currentOpp&&currentOpp.wk!=null)?currentOpp.wk:(F.wk||0);
  var gw=F.lastGrowWk!=null?Math.max(0,fw-F.lastGrowWk):17;F.lastGrowWk=fw;
  var perYear=0;
  if(age<(F.primeStart||26))perYear=(BAL.growYoung[0]+BAL.growYoung[1])/2*3*(F.learnRate||1);
  else if(age<=(F.primePeak||30))perYear=BAL.growPrime*3;
  perYear*=1+0.1*gym().part;
  var x=perYear*gw/52+(F.growCarry||0);n=Math.max(0,Math.floor(x));F.growCarry=Math.max(0,Math.min(1,x-n));
  var focus=STY_GROW[PLAYER_STY[F.style]]||[];
  for(var i=0;i<n;i++){
    var gf=gym().focus,rr=Math.random();
    var k=(rr<0.35&&gf.length)?pick(gf):((rr<0.7&&focus.length)?pick(focus):lowestAttr());
    if(k&&F.attrs[k]<(F.potential||99)){F.attrs[k]++;done++;}
  }
  recalcOvr();
  return done;
}

/* ===== MATCHMAKING, RANKING NAO-LINEAR E ECOSSISTEMA ===== */
function stepUp(streak){
  var r=Math.random(),s;
  if(r<0.40)s=1;else if(r<0.70)s=2;else if(r<0.88)s=3;else if(r<0.96)s=4;else s=5;
  if(streak>=3)s+=rnd(0,2);
  return s;
}
function climbToSmart(ref,dominant){
  var cur=playerIdx();
  RANK=RANK.filter(notYou);
  var idx=RANK.indexOf(ref);if(idx<0)idx=RANK.length;
  var jump=(dominant?rnd(0,2):rnd(0,1))+(starPower()>=2?1:0); /* quem vende evento sobe mais rápido */
  idx=Math.max(0,idx-jump);
  if(cur>=0)idx=Math.min(idx,Math.max(0,cur-rnd(0,1)));
  RANK.splice(idx,0,{you:true});
  DIVSTATE[curDivName].rank=RANK.slice(0,15);RANK=DIVSTATE[curDivName].rank;
}
function lossDrop(ref,kind,close){
  var pi=playerIdx();if(pi<0)return false;
  var oi=RANK.indexOf(ref),moved=false;
  if(oi>pi){RANK.splice(oi,1);RANK.splice(pi,0,ref);moved=true;pi=playerIdx();}
  var drop=close?0:((kind==='ko'||kind==='sub')?rnd(2,4):rnd(1,2));
  if(drop>0&&pi>=0){var np=Math.min(RANK.length-1,pi+drop);var me=RANK.splice(pi,1)[0];RANK.splice(np,0,me);moved=true;}
  return moved;
}
/* ===== FASE 1: DNA, IDADE, DECLÍNIO E APOSENTADORIA ===== */
function advanceTime(kind,won,r){
  F.fightCount=(F.fightCount||0)+1;
  var w=1; if(kind==='ko'||kind==='tko'||kind==='sub'){w+=won?1:3;} else if(kind==='dec'||kind==='tdec'){w+=1;}
  F.wear=(F.wear||0)+w;
  var o=currentOpp||{};
  passWeeks(Math.max(0,(o.wk!=null?o.wk:(F.wk||0)+8)-(F.wk||0)));
  F.lastFightWk=F.wk;
  var s=medSuspWeeks(kind,won,r||{});F.lastSusp=s;
  F.suspUntil=s>=3?F.wk+s:0;
  /* descanso antes do próximo camp: na Liga ~2 meses (2-3 lutas por ano, como no UFC); no circuito, menos */
  F.availWk=F.wk+Math.max(s,(F.stage2==='liga'?rnd(6,10):rnd(3,6))+(isDecision(kind)?1:0));
  if(F.ovr>(F.bestOvr||0))F.bestOvr=F.ovr;
  return s;
}
/* suspensão médica (semanas): nocaute 60-90 dias, TKO 45-60, knockdown sofrido ~30-45 */
function medSuspWeeks(kind,won,r){
  var w=1,Yp=GF?GF.Y:null,Op=GF?GF.O:null;
  if(won===false&&kind==='ko')w=rnd(9,13)+((F.cte||0)>=40?4:0);
  else if(won===false&&kind==='tko'&&!r.towel&&!r.cut&&!r.legs)w=rnd(6,9);
  else if(won===false&&kind==='tko')w=rnd(3,5);
  if(Op&&Op.s&&Op.s.kd>0)w=Math.max(w,rnd(4,6));
  if(Yp&&Yp.hp<30&&w<3)w=rnd(3,5);
  return w;
}
function applyAging(){
  var past=(F.age||22)-(F.primePeak||30);
  if(past<=0)return;
  var durFactor=1.4-(F.durability||70)/140;
  var wearFactor=1+(F.wear||0)/120;
  var dec=Math.max(1,Math.round(past*0.6*durFactor*wearFactor*(1-0.12*teamLv('fisico'))));
  ['poder','velocidade','cardio','queixo'].forEach(function(k){if(F.attrs[k]!=null)F.attrs[k]=Math.max(40,F.attrs[k]-dec);});
  ['precisao','chao','defesa','fightIQ'].forEach(function(k){if(F.attrs[k]!=null&&Math.random()<0.5)F.attrs[k]=Math.max(45,F.attrs[k]-1);});
  if(F.attrs.agressao!=null)F.attrs.agressao=Math.max(45,F.attrs.agressao-Math.round(dec/2));
  recalcOvr();
}
function checkRetire(){
  if(F.retired)return false;

    var p=Math.min(0.9,over*0.12+(F.wear||0)/300);
    if(F.age>=44||F.wear>=110||Math.random()<p){F.retired=true;F.retireCause=(F.wear>=110?'desgaste':'idade');return true;}
  }

function rollInjury(kind,won,round){
  if(F.retired)return;
  var risk=0.05;
  if(!won && (kind==='ko'||kind==='tko'))risk+=0.22;
  if(kind==='sub'&&!won)risk+=0.05;
  if(round>=3 && kind==='dec')risk+=0.06;
  risk+=(100-(F.durability||70))/400;
  risk+=(F.wear||0)/800+Math.max(0,(F.age||25)-32)*0.01;
  if(F.reinjuryRisk)risk+=0.12;
  F.reinjuryRisk=false;
  if(hasTrait('vidro'))risk+=0.1;if(hasTrait('ferro'))risk*=0.5;risk*=1-0.12*teamLv('fisio');risk*=gym().inj;
  if(kind==='nc')risk*=0.5;
  if(Math.random()>=risk)return;
  var tipo=pick(['corte profundo','mão fraturada','joelho estourado','ombro deslocado','costela trincada','nariz quebrado','ligamento rompido']);
  var rr=Math.random();
  var cataP=0.003+((F.age||25)>32?0.008:0)+((F.wear||0)>80?0.015:0)+(hasTrait('vidro')?0.02:0)+((F.durability||70)<65?0.008:0);
  var sev; if(rr<cataP)sev='cata';else if(rr<cataP+0.14)sev='grave';else if(rr<cataP+0.46)sev='moderada';else sev='leve';
  if(sev==='cata'){F.retired=true;F.retireCause='lesao';return;}
  if(sev==='leve'){F.money=Math.max(0,(F.money||0)-Math.round(5000*medFactor()));F.wear=(F.wear||0)+2;F._leveNote=true;return;}
  F.injuryPending={sev:sev,tipo:tipo,meses:(sev==='grave'?rnd(6,12):rnd(3,6)),cost:(sev==='grave'?150000:40000),perm:(sev==='grave'?rnd(2,4):0)};
}
/* Fração do custo médico que o lutador paga: várzea/nacional são baratos; na Liga o seguro cobre metade. */
function medFactor(){return F.stage2==='varzea'?0.08:(F.stage2==='nacional'?0.2:0.5);}
function injuryCosts(inj){var full=Math.round(inj.cost*medFactor()*(1-0.1*teamLv('fisio'))/100)*100;return {full:full,basic:Math.round(full*0.4/100)*100};}
function hurtAttrs(pts){var ks=['poder','velocidade','cardio','queixo','chao','precisao','defesa','agressao'];for(var i=0;i<pts;i++){var k=ks[Math.floor(Math.random()*ks.length)];if(F.attrs[k]!=null)F.attrs[k]=Math.max(40,F.attrs[k]-1);}recalcOvr();}
function openInjury(){
  var inj=F.injuryPending;if(!inj){closeLadder();return;}
  var ic=injuryCosts(inj),full=ic.full,basic=ic.basic;
  var canFull=(F.money||0)>=full,canBasic=(F.money||0)>=basic;
  var h='<div class="ladder-h">🏥 SALA DE RECUPERAÇÃO <button class="lx" onclick="closeLadder()">✕</button></div>';
  h+='<div style="padding:12px 16px;color:var(--dim);font-family:Oswald;font-size:12px">Você sofreu: <b style="color:#fff">'+inj.tipo+'</b> (lesão '+inj.sev+'). Carteira: <b style="color:#37d47e">'+fmtMoney(F.money||0)+'</b>.'+(F.stage2==='liga'?' O seguro da Liga cobre metade da conta.':'')+' Escolha a recuperação:</div>';
  h+='<div class="offer"><div class="of-top"><b>Cirurgia + recuperação total</b><span class="of-bonus" style="color:#ff2436">-'+fmtMoney(full)+'</span></div><div class="of-terms">Layoff ~'+inj.meses+' meses · volta 100%'+(inj.perm?' (grave: ainda ~'+inj.perm+' de sequela)':'')+'</div>'+(canFull?'<button class="btn gold sm" onclick="treatInjury(\'full\')">TRATAR ▸</button>':'<div class="of-note" style="color:var(--red2)">Sem dinheiro — precisa de '+fmtMoney(full)+'</div>')+'</div>';
  h+='<div class="offer"><div class="of-top"><b>Tratamento básico</b><span class="of-bonus" style="color:#ff2436">-'+fmtMoney(basic)+'</span></div><div class="of-terms">Layoff curto · sequela leve + risco de reagravar</div>'+(canBasic?'<button class="btn sm" onclick="treatInjury(\'basic\')">FAZER ▸</button>':'<div class="of-note" style="color:var(--red2)">Sem dinheiro — precisa de '+fmtMoney(basic)+'</div>')+'</div>';
  h+='<div class="offer"><div class="of-top"><b>Se virar sozinho</b><span class="of-bonus" style="color:var(--dim)">grátis</span></div><div class="of-terms">Sem médico: muito tempo parado, sequela pesada e alto risco de nova lesão'+(inj.sev==='grave'?' — pode encerrar a carreira':'')+'</div><button class="btn ghost sm" onclick="treatInjury(\'none\')">AGUENTAR NA RAÇA ▸</button></div>';
  showOverlay(h);
}
function treatInjury(mode){
  var inj=F.injuryPending;if(!inj)return;
  var ic=injuryCosts(inj);
  if(mode==='full'){if((F.money||0)<ic.full){toast('Sem dinheiro pra isso');return;}F.money-=ic.full;passWeeks(Math.round(inj.meses*4.33));if(inj.perm)hurtAttrs(inj.perm);}
  else if(mode==='basic'){if((F.money||0)<ic.basic){toast('Sem dinheiro pra isso');return;}F.money-=ic.basic;passWeeks(Math.round(inj.meses*4.33*0.45));hurtAttrs((inj.perm||0)+rnd(1,3));F.reinjuryRisk=true;}
  else{passWeeks(Math.round(inj.meses*4.33*1.3));hurtAttrs((inj.perm||0)+rnd(3,6));F.reinjuryRisk=true;F.wear=(F.wear||0)+4;if(inj.sev==='grave'&&Math.random()<((F.age||25)>=30?0.12:0.04)){F.retired=true;F.retireCause='lesao';F.injuryPending=null;closeLadder();showRetirement();return;}}
  F.wear=(F.wear||0)+3;F.injuryPending=null;F.availWk=Math.max(F.availWk||0,F.wk);F.lastGrowWk=F.wk; /* na recuperação ninguém evolui */
  closeLadder();renderStages();renderFicha();
  if(checkRetire()){showRetirement();return;}
  nextFight();
}

/* checagem depois de cada luta */
function checkAchFight(r,o,stats){
  var won=r.won===true,y=stats?stats.y:null;
  unlockAch('estreia');
  if(won){
    if(r.kind==='ko'||r.kind==='tko')unlockAch('ko1');
    if(r.kind==='sub')unlockAch('sub1');
    if(r.kind==='ko'&&r.round===1&&r.time&&parseInt(r.time,10)===0)unlockAch('relampago');
    if(r.legs)unlockAch('perna');
    if(r.cut)unlockAch('sangue');
    if(GF&&GF.Y.s&&GF.O.s.kd>0)unlockAch('virada');
    if(r.kind==='dec'&&GF&&GF.rounds===5)unlockAch('guerra');
    if(y&&y.td>=4)unlockAch('quedas');
    if(y&&y.ss>=60)unlockAch('precisao');
    if(o.rematch)unlockAch('vinganca');
    if(o.ovr-F.ovr>=8)unlockAch('zebra');
    if(o.short)unlockAch('substituto');
    if(o.week&&o.week.media==='trash'){F.trashWins=(F.trashWins||0)+1;if(F.trashWins>=3)unlockAch('trash');}
  }
  if((F.streak||0)>=5)unlockAch('seq5');
  if((F.streak||0)>=10)unlockAch('seq10');
  if(F.w>=10&&F.l===0)unlockAch('invicto');
  if(o.event&&o.event.slot==='MAIN EVENT'&&!o.circuit)unlockAch('mainevent');
  checkAchCareer();
}

  if((F.titleDef||0)>=5)unlockAch('def5');
  if((F.titleDef||0)>=10)unlockAch('def10');
  if(beltCount()>=2)unlockAch('champchamp');
  if((F.careerEarn||0)>=1e6)unlockAch('milhao');
  if((F.careerEarn||0)>=1e7)unlockAch('dezmilhoes');
  if((F.fans||0)>=1e6)unlockAch('viral');

function clonePose(p){return {x:p.x||0,gy:p.gy||0,bk:p.bk||0,t:p.t,n:p.n,aL:p.aL.slice(),aR:p.aR.slice(),lL:[p.lL[0],p.lL[1],p.lL[2]||0],lR:[p.lR[0],p.lR[1],p.lR[2]||0]};}
function lerpPose(a,b,k){
  function l(x,y){return x+(y-x)*k;}
  function la(x,y){return [l(x[0],y[0]),l(x[1],y[1]),l(x[2]||0,y[2]||0)];}
  return {x:l(a.x||0,b.x||0),gy:l(a.gy||0,b.gy||0),bk:l(a.bk||0,b.bk||0),t:l(a.t,b.t),n:l(a.n,b.n),aL:la(a.aL,b.aL),aR:la(a.aR,b.aR),lL:la(a.lL,b.lL),lR:la(a.lR,b.lR)};
}
function easeIO(k){return k<0.5?2*k*k:1-Math.pow(-2*k+2,2)/2;}
function easeOut(k){return 1-Math.pow(1-k,3);}

function tecToAct(tec){
  var t=(tec||'').toLowerCase();
  if(/chute alto|rodado/.test(t))return 'kickH';
  if(/chute no corpo|frontal/.test(t))return 'kickB';
  if(/joelhada/.test(t))return 'knee';
  if(/cotovelada/.test(t))return 'elbow';
  if(/uppercut/.test(t))return 'upper';
  if(/overhand/.test(t))return 'overhand';
  if(/sequência/.test(t))return 'combo';
  if(/cruzado|gancho/.test(t))return 'hook';
  if(/jab/.test(t))return 'jab';
  return 'cross';

/* ---------- eventos da luta -> animação ---------- */
function arenaEvent(e,ar){
  var a=ar||FIGHT_ARENA;if(!a)return;
  if(e.type==='round'){a.mode='pe';a.gp=null;a.top=null;a.clK=null;arenaZ(a,'Ob Of Yb Yf');['you','opp'].forEach(function(k){var f=a.f[k];f.mode='stand';f.rocked=0;f.face=1;f.gpose=null;rigPlay(f,[['guard',420,0]]);});return;}
  if(e.y!=null)dkUpdate(a,e);
  var by=e.by?a.f[e.by]:null,tg=by?by.other:null,act=e.act,hitP=Math.min(1,(e.dmg||4)/18);
  if(e.pos==='chao'&&e.top&&act!=='td'&&act!=='pass'&&act!=='sweep'&&(a.mode!=='chao'||a.gp!==e.gp||a.top!==e.top)){arenaGround(a,e.top,e.gp,a.mode!=='chao');}
  if(e.pos==='pe'&&a.mode==='chao'&&act!=='standup')arenaStand(a);
  if(e.pos==='clinch'&&e.cl&&act!=='clinch'&&act!=='crev'&&(a.mode!=='clinch'||a.clK!==e.cl))arenaClinch(a,e.cl);
  if(e.pos==='pe'&&a.mode==='clinch'&&act!=='cbreak'&&!(e.kd||e.fin))arenaBreak(a);
  if(e.yr!=null){a.f.you.rocked=e.yr?1600:0;a.f.opp.rocked=e.or?1600:0;}
  if(e.ys!=null){a.f.you.tired=e.ys<25;a.f.opp.tired=e.os<25;}
  if(!act||!by)return;
  if(ACT_SEQ[act]){
    if(a.mode==='chao')return;
    if(a.mode==='clinch'){if(e.kd||e.fin)arenaBreak(a);else{arenaCKnee(a,by,e,hitP);return;}}
    var seq=(e.tgt==='body'&&ACT_BODY[act])?ACT_BODY[act]:ACT_SEQ[act],imp=seqImpact(seq);
    rigPlay(by,seq);
    setTimeout(function(){
      if(!tg)return;
      if(e.miss){rigPlay(tg,REACT_SEQ[act==='kickL'?'check':((act==='hook'||act==='overhand')&&Math.random()<0.6?'roll':(act.indexOf('kick')===0?'block':(Math.random()<0.55?'slip':'block')))]);return;}
      var part=act.indexOf('kick')===0?(act==='kickL'?'leg':(act==='kickB'?'body':'head')):(e.tgt||'head');
      arenaImpact(a,tg,part,hitP,e.dmg>=12||(e.oc||e.yc));
      if(e.fin==='ko')koFall(a,tg);
      else if(e.kd)rigPlay(tg,REACT_SEQ.knockdown);

    },imp/a.ts);

  if(act==='cbreak'){arenaBreak(a);return;}
  if(act==='cknee'){if(a.mode!=='clinch')arenaClinch(a,e.by);arenaCKnee(a,by,e,hitP);return;}
  if(act==='foul'){var fo=FOULS[e.tgt]||{};
    if(a.mode==='chao'||!fo.act||!ACT_SEQ[fo.act]){if(tg&&tg.gpose){var fp=clonePose(tg.gpose);fp.n-=14;rigPlay(tg,[{p:fp,d:90},{p:tg.gpose,d:420}],true);}return;}
    var fq=ACT_SEQ[fo.act];rigPlay(by,fq);
    setTimeout(function(){arenaImpact(a,tg,fo.hit==='body'?'body':'head',0.3,false);rigPlay(tg,[[fo.hit==='body'?'hitBody':'hitHead',120,-10],[fo.hit==='body'?'hitBody':'wobble',650,-26],['guard',420,0]]);},seqImpact(fq)/a.ts);return;}
  if(act==='td'){rigPlay(by,[['shootLoad',100,0],['shoot',140,40]]);setTimeout(function(){arenaImpact(a,tg,'body',0.5,false);SND.thud();arenaGround(a,e.by,e.gp||0,true);},240/a.ts);return;}
  if(act==='sprawl'){rigPlay(tg,[['shootLoad',90,0],['shoot',150,30],['guard',300,0]]);rigPlay(by,REACT_SEQ.sprawl);return;}
  if(act==='catch'){rigPlay(tg,[['kickLLoad',90,4],['kickL',110,10]]);rigPlay(by,[['catchLeg',120,4]]);return;}
  if(act==='gnp'&&a.mode==='chao'&&by.gtop&&by.gpose){arenaGnp(a,by,tg,hitP,e.dmg>=10);return;}
  if((act==='subTry'||act==='tap')&&a.mode==='chao'&&by.gpose&&tg.gpose){arenaSub(a,by,tg,act==='tap');return;}
  if(act==='pass'&&a.mode==='chao'){arenaGround(a,e.by,e.gp);return;}
  if(act==='sweep'&&a.mode==='chao'){arenaGround(a,e.by,1);return;}
  if(act==='standup'){arenaStand(a);return;}
  if(act==='legTko'){rigPlay(tg,[['hitLeg',120,-6],['fallSit',300,-20]],true);tg.mode='down';tg.downPose='fallSit';return;}
}

var CINE=null;
function cinePlay(steps,done){

  function end(){if(finished)return;finished=true;clearTimeout(t);el.classList.remove('on');el.innerHTML='';el.onclick=null;CINE=null;if(done)done();flushAch();}
  function step(){
    if(i>=steps.length){end();return;}
    var s=steps[i++];

  }
  if(d.v<5){
    var g=d.F;g.gym=g.gym||'bairro';g.pend=g.pend||[];g.cte=g.cte||0;g.primeTitles=g.primeTitles||0;
    if(g.fans==null)g.fans=300+(g.w||0)*900+(g.stage2==='liga'?25000:(g.stage2==='nacional'?2000:0))+(g.titleWins||0)*150000;
    if(g.stage2==='liga'&&!g.deal)g.deal={left:rnd(1,4),n:4};
    d.v=5;
  }
  if(d.v<6){var h6=d.F;h6.gender=h6.gender||'M';h6.song=h6.song||0;h6.comebacks=h6.comebacks||0;h6.ctePen=h6.ctePen||0;h6.cteWarn=h6.cteWarn||{};d.v=6;}
  return d;
}
function migrateV1(d){
  for(var n in d.DIVSTATE){var st=d.DIVSTATE[n];
    st.rank.forEach(function(e,k){if(e.you)return;e.sty=styleFor(e.name);e.a=genAttrs(npcOvrForRank(k),e.sty,3);e.ovr=ovrOf(e.a);});
    if(st.champ){st.champ.sty=styleFor(st.champ.name);st.champ.a=genAttrs(84+rnd(0,3),st.champ.sty,3);st.champ.ovr=ovrOf(st.champ.a);}
  }
  if(d.phase==='prefight'||d.phase==='fight'){d.phase='prefight';d.opp=null;}
  d.F.cs=d.F.cs||{};
  d.v=2;
}
function clearSave(){try{localStorage.removeItem(SAVE_KEY);}catch(e){}}
function resolveRef(n){if(!n)return null;if(CHAMP&&CHAMP.name===n)return CHAMP;var i=rankIndexByName(n);return i>=0?RANK[i]:null;}
function loadGame(){
  var d=readSave();if(!d){renderContinue();return;}
  F=d.F;DIVSTATE=d.DIVSTATE;WORLD=d.WORLD||{ev:212,cev:1,news:[],tick:0};
  /* o ex-campeão fica no ranking E como champ da divisão: refaz essa referência compartilhada */
  for(var n in DIVSTATE){var st=DIVSTATE[n];if(!st.champ)continue;for(var i=0;i<st.rank.length;i++)if(!st.rank[i].you&&st.rank[i].name===st.champ.name){st.champ=st.rank[i];break;}}
  setDivision(d.cur||F.weight);
  genAllDivisions();DIVS.forEach(function(x){divFighters(x.name).forEach(function(e){ensureNPC(e);});});bmfInit();
  LASTRES=d.last||null;RESULTVIEW=d.view||null;
  currentOpp=d.opp||null;if(currentOpp)currentOpp.ref=resolveRef(currentOpp.refName);
  PHASE=d.phase||'prefight';
  show("scr-game");renderFicha();updateHUD();
  if(PHASE==='result'&&RESULTVIEW)showResult(RESULTVIEW,false);
  else if(F.retired||PHASE==='retired')showRetirement();
  else if(PHASE==='fight'&&currentOpp){simulateFight();skipSim();toast('Você saiu no meio da luta — ela foi decidida sem você no córner.');}
  else if(PHASE==='prefight'&&currentOpp){renderPrefight();if(currentOpp.weighDec)renderWeighDecision();}
  else if(PHASE==='week'&&currentOpp&&currentOpp.week){renderWeek();if(currentOpp.wdPending)renderWithdraw();}
  else if(PHASE==='offers'&&F.offers&&F.offers.length)renderOffers();
  else nextFight();
}
function renderContinue(){
  var el=document.getElementById("scr-continue"),d=readSave();
  if(!d){el.classList.add("hidden");return;}
  var f=d.F,st=d.DIVSTATE[d.cur],pos;
  if(f.retired||d.phase==='retired')pos='Aposentado';
  else if(f.stage2==='varzea')pos='Circuito de várzea';
  else if(f.stage2==='nacional')pos='Circuito nacional';
  else if(f.stage2==='prime')pos='PRIME FC';
  else if(f.belts&&f.belts[d.cur])pos='🏆 Campeão';
  else{pos='sem ranking';if(st)for(var i=0;i<st.rank.length;i++)if(st.rank[i].you){pos='#'+(i+1);break;}}
  el.innerHTML='<div class="sect-h">Carreira salva</div>'+
    '<div class="cont-card"><div class="cont-fig">'+fighterSVG('red')+'</div><div class="cont-info">'+
      '<b>'+cleanName(f.name,20).toUpperCase()+'</b><span>"'+cleanName(f.nick,14)+'"</span>'+
      '<small>'+d.cur+' · '+pos+'<br>Cartel '+f.w+'-'+f.l+'-'+f.d+' · OVR '+f.ovr+' · '+(f.age||22)+' anos</small></div></div>'+
    '<button class="btn gold" onclick="loadGame()">Continuar carreira &#9656;</button>'+
    '<div class="cont-note">ou crie um novo lutador abaixo</div>';
  el.classList.remove("hidden");
}
function askConfirm(msg,okLabel,okJs){
  showOverlay('<div class="ladder-h">CONFIRMAR <button class="lx" onclick="closeLadder()">✕</button></div>'+
    '<div class="confirm-msg">'+msg+'</div>'+
    '<div class="confirm-acts"><button class="btn ghost sm" onclick="closeLadder()">Cancelar</button><button class="btn sm" onclick="closeLadder();'+okJs+'">'+okLabel+'</button></div>');
}
function confirmRestart(){askConfirm('Isso apaga a carreira de <b>'+F.nick+'</b> ('+F.w+'-'+F.l+'-'+F.d+'). Não dá pra desfazer.','APAGAR E RECOMEÇAR','newCareer()');}
function newCareer(){clearSave();location.reload();}

function show(id){
  ["scr-continue","scr-create","scr-hof","scr-game"].forEach(function(s){document.getElementById(s).classList.add("hidden");});
  document.getElementById(id).classList.remove("hidden");window.scrollTo(0,0);
}
var toastT;
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove("show");},2200);}
</script>
</body>
</html>
